  function renderEquipe(e, foco) {
    const det = $("#detalhe");
    const papeis = e.papeis.map((p) => `<div class="box eq${foco === p.dono ? " foco" : ""}" id="eq-${esc(p.dono.replace(":", "-"))}">
        <div class="row"><h2 class="grow">${esc(p.nome)}</h2><span class="dim">função do leradev</span></div>
        <p class="dim">${esc(p.descricao)}</p>
        ${p.aceitaAgentes ? `<div class="row" style="flex-wrap:wrap;gap:6px"><span class="dim">Agentes:</span>${editorAgentes(p.agentes, `papel:${p.id}`, true)}</div>` : ""}
        <strong>Conhecimento</strong>${cartaoFontes(p.dono, p.fontes)}
      </div>`).join("");
    const agentes = e.agentes.map((a) => `<div class="box eq${foco === a.dono ? " foco" : ""}" id="eq-${esc(a.dono.replace(":", "-"))}">
        <div class="row"><h2 class="grow">${esc(a.emoji ? `${a.emoji} ` : "")}${esc(a.nome)}</h2><span class="dim mono">${esc(a.slug)}</span></div>
        ${a.descricao ? `<p class="dim">${esc(a.descricao)}</p>` : ""}
        <div class="dim">Alocado em: ${a.onde.length ? a.onde.map((o) => `<a href="${esc(o.link)}">${esc(o.rotulo)}</a>`).join(" · ") : "nenhum lugar agora"}</div>
        <strong>Conhecimento</strong>${cartaoFontes(a.dono, a.fontes)}
      </div>`).join("");
    det.innerHTML = `
      <div class="dhead"><div class="row"><button class="btn sm ghost" data-voltar aria-label="Voltar">←</button><span class="chip tool">Equipe</span><span class="grow"></span><a class="btn sm jev" href="/mapas?mapa=${esc(e.mapaId)}">Ver no 3D ▸</a></div>
        <h3>Agentes e conhecimento (RAG)</h3></div>
      <div class="dbody" style="max-width:900px;width:100%;margin:0 auto">
        <p class="dim">Cada função do leradev e cada agente do catálogo pode ter conhecimento: pastas, arquivos, notas ou páginas. Quando o agente trabalha numa tarefa, o leradev busca os trechos que importam para o pedido e manda junto. Notas curtas entram sempre (boas para regras). O Jev recebe o conhecimento dele ao validar.</p>
        <h2>Funções do leradev</h2>${papeis}
        <h2>Agentes alocados ou com conhecimento</h2>${agentes || `<p class="dim">Nenhum agente alocado agora.</p>`}
        <div class="box"><div class="row" style="gap:6px;flex-wrap:wrap"><span class="grow">Configurar outro agente do catálogo:</span>
          <select id="eqOutro"><option value="">escolher…</option>${(catalogo ?? []).map((a) => `<option value="${esc(a.slug)}">${esc(a.nome)}</option>`).join("")}</select></div></div>
      </div>`;
    det.querySelector("[data-voltar]").onclick = () => ir("#/");
    const recarregar = (f) => carregarEquipe(f);
    ligarEditorAgentes(det, (k) => e.papeis.find((p) => `papel:${p.id}` === k)?.agentes ?? [], async (k, slugs) => {
      if (await acao(() => api("papel_agentes_definir", { papel: k.slice(6), agentes: slugs }), "Agentes da função atualizados.")) recarregar(k);
    });
    det.querySelectorAll("[data-ftipo]").forEach((sel) => sel.addEventListener("change", () => { det.querySelector(`[data-fval="${CSS.escape(sel.dataset.ftipo)}"]`).placeholder = FONTE_DICA[sel.value]; }));
    det.querySelectorAll("[data-fadd]").forEach((b) => b.addEventListener("click", async () => {
      const dono = b.dataset.fadd;
      const q = (a) => det.querySelector(`[${a}="${CSS.escape(dono)}"]`);
      const tipo = q("data-ftipo").value, val = q("data-fval").value.trim(), titulo = q("data-ftitulo").value.trim();
      if (!val) return toast("Preencha o campo.");
      const args = { dono, tipo, titulo, ...(tipo === "nota" ? { texto: val } : tipo === "url" ? { url: val } : { caminho: val }) };
      if (await acao(() => api("rag_fonte_adicionar", args), "Conhecimento adicionado.")) recarregar(dono);
    }));
    det.querySelectorAll("[data-frm]").forEach((b) => b.addEventListener("click", async () => {
      const [dono, id] = b.dataset.frm.split("|");
      if (await acao(() => api("rag_fonte_remover", { dono, id }), "Tirado.")) recarregar(dono);
    }));
    det.querySelectorAll("[data-busca]").forEach((b) => b.addEventListener("click", async () => {
      const dono = b.dataset.busca;
      const consulta = det.querySelector(`[data-qbusca="${CSS.escape(dono)}"]`).value.trim();
      if (!consulta) return;
      const r = await acao(() => api("rag_testar", { dono, consulta, projetoId: projetoSel }));
      if (r) det.querySelector(`[data-res="${CSS.escape(dono)}"]`).innerHTML = r.length ? r.map((x) => `<details class="achado"><summary>${esc(x.origem)}${x.score != null ? ` <span class="dim">· ${x.score}</span>` : " <span class=\"dim\">· sempre</span>"}</summary><pre class="diff">${esc(x.texto)}</pre></details>`).join("") : `<p class="dim">Nada encontrado para essa busca.</p>`;
    }));
    $("#eqOutro").addEventListener("change", (ev) => { if (ev.target.value) ir(`#/k/agente:${ev.target.value}`); });
    const alvo = foco && document.getElementById(`eq-${foco.replace(":", "-")}`);
    if (!foco) det.scrollTop = 0;
    if (alvo) alvo.scrollIntoView({ block: "start" });
    else if (foco?.startsWith("agente:")) {
      // agente ainda sem conhecimento nem alocação: mostra um cartão para começar
      const slug = foco.slice(7);
      const a = catalogo?.find((x) => x.slug === slug);
      if (a) {
        const box = document.createElement("div");
        box.className = "box eq foco";
        box.id = `eq-${foco.replace(":", "-")}`;
        box.innerHTML = `<div class="row"><h2 class="grow">${esc(a.emoji ? `${a.emoji} ` : "")}${esc(a.nome)}</h2><span class="dim mono">${esc(slug)}</span></div><div class="dim">Ainda sem conhecimento.</div><strong>Conhecimento</strong>${cartaoFontes(foco, [])}`;
        det.querySelector(".dbody").insertBefore(box, det.querySelector(".dbody h2"));
        box.querySelector("[data-fadd]").addEventListener("click", async () => {
          const q = (at) => box.querySelector(`[${at}]`);
          const tipo = q("data-ftipo").value, val = q("data-fval").value.trim(), titulo = q("data-ftitulo").value.trim();
          if (!val) return toast("Preencha o campo.");
          if (await acao(() => api("rag_fonte_adicionar", { dono: foco, tipo, titulo, ...(tipo === "nota" ? { texto: val } : tipo === "url" ? { url: val } : { caminho: val }) }), "Conhecimento adicionado.")) recarregar(foco);
        });
        box.querySelector("[data-ftipo]").addEventListener("change", (ev) => { box.querySelector("[data-fval]").placeholder = FONTE_DICA[ev.target.value]; });
        box.scrollIntoView({ block: "start" });
      }
    }
  }

  // ---------------- mapa de arquitetura do projeto ----------------
  let mpCfg = null, mpPara = null, mpCamadas = null;
  const MP_ST = { gerando: "lendo o projeto", validando: "Jev validando", corrigindo: "corrigindo", pronto: "pronto", erro: "erro", parado: "parado" };
  const MP_CLS = { gerando: "rodando", validando: "revisando", corrigindo: "ajustando", pronto: "concluida", erro: "erro", parado: "parada" };
  const rodandoMapa = (g) => ["gerando", "validando", "corrigindo"].includes(g?.status);

  async function carregarMapa(forcar = false) {
    if (rota?.tipo !== "p") return;
    if (projetoSel !== rota.id && estado?.projetos.some((x) => x.id === rota.id)) { projetoSel = rota.id; store.set("lera.central.projeto", projetoSel); }
    try {
      if (forcar || mpPara !== rota.id || !mpCfg) {
        mpCfg = await api("projeto_mapa_config_obter", { projetoId: rota.id });
        mpPara = rota.id;
        mpCamadas = mpCfg.camadas.map((c) => ({ ...c, ligada: true }));
        for (const c of [...mpCfg.padrao, ...mpCfg.extras]) if (!mpCamadas.some((x) => x.id === c.id)) mpCamadas.push({ ...c, ligada: false });
        renderMapaConfig();
      }
      const s = await api("projeto_mapa_status", { projetoId: rota.id });
      renderMapaStatus(s);
    } catch (e) {
      $("#detalhe").innerHTML = `<div class="vazio"><h2>Não consegui abrir o mapa</h2><p>${esc(e.message)}</p><button class="btn" data-voltar>Voltar</button></div>`;
      $("#detalhe [data-voltar]").onclick = () => ir("#/");
    }
  }

  function linhaCamada(c, i) {
    return `<div class="mp-cam${c.ligada ? "" : " off"}" data-i="${i}">
      <input type="checkbox" ${c.ligada ? "checked" : ""} aria-label="Usar a camada ${esc(c.rotulo)}" data-k="ligada">
      <div class="grow" style="min-width:0">
        <input type="text" value="${esc(c.rotulo)}" data-k="rotulo" aria-label="Nome da camada" maxlength="40">
        <input type="text" value="${esc(c.descricao ?? "")}" data-k="descricao" class="dim" aria-label="O que entra nesta camada" placeholder="O que entra nesta camada (a ferramenta e o Jev leem isto)" maxlength="400">
      </div>
      <div class="col"><button class="btn sm ghost" data-mv="-1" type="button" aria-label="Subir">↑</button><button class="btn sm ghost" data-mv="1" type="button" aria-label="Descer">↓</button></div>
    </div>`;
  }

  function renderMapaConfig() {
    const p = estado?.projetos.find((x) => x.id === rota.id);
    const c = mpCfg;
    const ag = c.agentes.find((a) => a.slug === c.agente);
    $("#detalhe").innerHTML = `
      <div class="dhead">
        <div class="row"><button class="btn sm ghost" data-voltar aria-label="Voltar">←</button><span class="chip tool">Mapa</span><span id="mpChip"></span><span class="grow"></span><a class="btn sm" id="mpAbrir" href="/mapas?mapa=projeto-${esc(rota.id)}" style="display:none">Abrir em 3D ▸</a></div>
        <h3>Arquitetura · ${esc(p?.nome ?? rota.id)}</h3>
      </div>
      <div class="dbody" style="max-width:860px;width:100%;margin:0 auto">
        <div id="mpStatus"></div>
        <div class="box">
          <div class="row"><h2 class="grow">Camadas do mapa</h2><button class="btn sm ghost" id="mpRestaurar" type="button">Padrão</button></div>
          <p class="dim">De cima para baixo. Desmarque o que o projeto não tem; renomeie ou descreva do seu jeito.</p>
          <div id="mpCamadas">${mpCamadas.map(linhaCamada).join("")}</div>
          <div class="row" style="margin-top:6px"><input type="text" id="mpNova" placeholder="Nova camada (ex.: Pagamentos)" maxlength="40" class="grow"><button class="btn sm" id="mpAdd" type="button">+ Camada</button></div>
        </div>
        <div class="row" style="flex-wrap:wrap;gap:10px">
          <label class="f grow">Ferramenta que constrói<select id="mpFerr">${c.ferramentas.map((f) => `<option value="${esc(f.id)}"${f.id === c.ferramenta ? " selected" : ""}${estado?.ferramentas?.[f.id]?.ok === false ? " disabled" : ""}>${esc(f.nome)}${estado?.ferramentas?.[f.id]?.ok === false ? " (não instalado)" : ""}</option>`).join("")}</select></label>
          <label class="f grow">Agente do catálogo<select id="mpAgente"><option value="nenhum"${c.agente === "nenhum" ? " selected" : ""}>Nenhum</option>${c.agentes.map((a) => `<option value="${esc(a.slug)}"${a.slug === c.agente ? " selected" : ""}>${esc(a.emoji ? `${a.emoji} ` : "")}${esc(a.nome)}</option>`).join("")}</select></label>
        </div>
        <label class="f">Instruções extras (opcional)<textarea id="mpInstr" rows="2" placeholder="Ex.: destaque as filas e o que não tem health check"></textarea></label>
        <div class="acoes"><button class="btn primary" id="mpGerar" type="button" style="min-height:44px">Gerar mapa ▸</button><button class="btn danger" id="mpParar" type="button" style="display:none">Parar</button><span class="dim">Só leitura: a ferramenta não altera o projeto. ${ag ? `Agente: ${esc(ag.nome)}.` : ""} O Jev confere o mapa contra os arquivos e pede uma correção se precisar.</span></div>
      </div>`;
    $("#detalhe [data-voltar]").onclick = () => ir("#/");
    const box = $("#mpCamadas");
    box.addEventListener("input", (e) => {
      const i = Number(e.target.closest("[data-i]")?.dataset.i);
      const k = e.target.dataset.k;
      if (!Number.isInteger(i) || !k) return;
      mpCamadas[i][k] = k === "ligada" ? e.target.checked : e.target.value;
      if (k === "ligada") e.target.closest(".mp-cam").classList.toggle("off", !e.target.checked);
    });
    box.addEventListener("click", (e) => {
      const mv = e.target.dataset.mv;
      if (!mv) return;
      const i = Number(e.target.closest("[data-i]").dataset.i), j = i + Number(mv);
      if (j < 0 || j >= mpCamadas.length) return;
      [mpCamadas[i], mpCamadas[j]] = [mpCamadas[j], mpCamadas[i]];
      box.innerHTML = mpCamadas.map(linhaCamada).join("");
    });
    $("#mpAdd").onclick = () => {
      const r = $("#mpNova").value.trim();
      if (!r) return;
      mpCamadas.push({ rotulo: r, descricao: "", ligada: true });
      box.innerHTML = mpCamadas.map(linhaCamada).join("");
      $("#mpNova").value = "";
    };
    $("#mpRestaurar").onclick = async () => {
      const r = await acao(() => api("projeto_mapa_config_definir", { projetoId: rota.id, restaurar: true }), "Camadas padrão.");
      if (r) carregarMapa(true);
    };
    $("#mpGerar").onclick = async () => {
      const camadas = mpCamadas.filter((c) => c.ligada && c.rotulo.trim()).map(({ id, rotulo, descricao }) => ({ id, rotulo, descricao }));
      const salvo = await acao(() => api("projeto_mapa_config_definir", { projetoId: rota.id, camadas, ferramenta: $("#mpFerr").value, agente: $("#mpAgente").value }));
      if (!salvo) return;
      const r = await acao(() => api("projeto_mapa_gerar", { projetoId: rota.id, instrucoes: $("#mpInstr").value }), "Gerando o mapa…");
      if (r) { await carregarMapa(true); $("#mpStatus")?.scrollIntoView({ behavior: "smooth", block: "start" }); }
    };
    $("#mpParar").onclick = async () => { await acao(() => api("projeto_mapa_parar", { projetoId: rota.id }), "Parado."); carregarMapa(); };
  }

  function barraJev(rotulo, p, bom = "sim") {
    const ok = bom === "sim" ? p > 0.7 : p < 0.3, ruim = bom === "sim" ? p < 0.3 : p > 0.7;
    return `<div class="mp-jev"><span class="grow">${esc(rotulo)}</span><span class="bar" style="width:90px"><i style="width:${Math.round(p * 100)}%;background:${ok ? "var(--ok)" : ruim ? "var(--bad)" : "var(--warn)"}"></i></span><span class="mono" style="width:40px;text-align:right">${pct(p)}</span></div>`;
  }

  function renderMapaStatus(s) {
    const el = $("#mpStatus");
    if (!el) return;
    const g = s.geracao;
    const v = (g?.status === "pronto" || g?.status === "erro" || g?.status === "corrigindo" ? g?.validacao : null) ?? s.mapa?.validacao ?? null;
    $("#mpChip").innerHTML = g ? `<span class="chip st-${MP_CLS[g.status] ?? "parada"}">${esc(MP_ST[g.status] ?? g.status)}${g.rodada > 1 && rodandoMapa(g) ? " · 2ª rodada" : ""}</span>` : "";
    $("#mpAbrir").style.display = !s.mapa || s.mapa.erro ? "none" : "";
    $("#mpGerar").disabled = rodandoMapa(g);
    $("#mpGerar").textContent = s.mapa ? "Atualizar mapa ▸" : "Gerar mapa ▸";
    $("#mpParar").style.display = rodandoMapa(g) ? "" : "none";
    const partes = [];
    if (rodandoMapa(g)) {
      partes.push(`<div class="box"><strong>${g.status === "validando" ? "O Jev está conferindo o mapa contra os arquivos…" : g.status === "corrigindo" ? "O Jev pediu ajustes; a ferramenta está corrigindo." : `${esc(NOMES[g.ferramenta] ?? g.ferramenta)} está lendo o projeto…`}</strong>
        ${g.problemas?.length ? `<ul class="dim">${g.problemas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${g.tarefaId ? `<div style="margin-top:6px"><a class="btn sm ghost" href="#/t/${esc(g.tarefaId)}">Ver o que a ferramenta está fazendo</a></div>` : ""}</div>`);
    } else if (g?.status === "erro") {
      partes.push(`<div class="box" style="border-color:var(--bad)"><strong>Não deu certo.</strong> ${esc(g.erro ?? "")}${g.tarefaId ? ` <a href="#/t/${esc(g.tarefaId)}">Ver a conversa</a>` : ""}</div>`);
    }
    if (v) {
      if (v.semJev) partes.push(`<div class="box"><strong>Mapa salvo sem validação do Jev.</strong> <span class="dim">${esc(v.erro ?? "")}</span></div>`);
      else partes.push(`<div class="box"><div class="row"><h2 class="grow">Validação do Jev</h2>${v.aprovado ? `<span class="chip st-concluida">aprovado</span>` : `<span class="chip st-aguardando">revisar</span>`}<span class="dim">${v.completude ? `completude: ${esc(v.completude.texto)}` : ""}</span></div>
        ${(v.camadas ?? []).map((c) => barraJev(`Camada ${c.rotulo} fiel ao código`, c.probabilidade)).join("")}
        ${v.faltando != null ? barraJev("Falta parte importante", v.faltando, "nao") : ""}
        ${v.ligacoes != null ? barraJev("Ligações entre camadas corretas", v.ligacoes) : ""}
        ${!v.aprovado && v.problemas?.length ? `<p class="dim" style="margin:6px 0 0">O que o Jev apontou (vai junto no pedido de correção):</p><ul class="dim">${v.problemas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      </div>`);
    }
    if (s.mapa && !s.mapa.erro) partes.push(`<p class="dim">Mapa atual: ${s.mapa.nos} itens, ${s.mapa.ligacoes} ligações${s.mapa.atualizado ? ` · ${esc(s.mapa.atualizado)}` : ""}. Fica em <span class="mono">.lera/mapa.json</span> no projeto.</p>`);
    else if (!g) partes.push(`<p class="muted">Este projeto ainda não tem mapa. Ajuste as camadas abaixo e toque em <strong>Gerar mapa</strong>.</p>`);
    const html = partes.join("");
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
  }

  // ---------------- laço ----------------
  function renderTudo() {
    document.body.classList.toggle("vendo", !!rota);
    if (estado) renderLista();
    if (!rota) {
      renderComposer(true);
    } else if (rota.tipo === "t") carregarTarefa();
    else if (rota.tipo === "p") carregarMapa(true);
    else if (rota.tipo === "a") carregarAssistente();
    else if (rota.tipo === "k") carregarEquipe();
    else carregarCoord();
  }
  let ciclo = 0;
  async function loop() {
    ciclo++;
    if (!document.hidden || ciclo % 4 === 0) {
      if (rota?.tipo === "t") await carregarTarefa();
      if (rota?.tipo === "c" && ciclo % 2 === 0) await carregarCoord();
      if (rota?.tipo === "p" && ciclo % 2 === 0) await carregarMapa();
      if (rota?.tipo === "a") await carregarAssistente();
      if (ciclo % 3 === 0 || !estado) await carregar();
      if (Date.now() - contasQuando > 60000) carregarContas();
    }
    setTimeout(loop, 900);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { document.title = "Central · leradev"; carregar(); } });
  carregar().then(renderTudo);
  loop();
})();
</script>
</body>
</html>
