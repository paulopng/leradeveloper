<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central · leradev</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c140e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #120d09;
  --panel: #1c140e;
  --panel-2: #2a1d14;
  --panel-3: #3a2a1d;
  --line: #4a3524;
  --line-hi: #9a7048;
  --ink: #f3e9d8;
  --muted: #c2ae92;
  --dim: #8a7660;
  --gold: #f2c14e;
  --ok: #5fd068;
  --warn: #f2c14e;
  --bad: #ff6b6b;
  --info: #7cc8ff;
  --jev: #c9a2ff;
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--info); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 2px solid #000; box-shadow: inset 0 -2px 0 var(--line); }
.brand { margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 700 20px/1.1 var(--f-pixel); letter-spacing: .06em; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.brand .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.live { width: 8px; height: 8px; background: var(--ok); box-shadow: 0 0 0 2px #000; }
.live.off { background: var(--bad); }
nav.links { display: flex; gap: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 12px; border-radius: var(--r); border: 2px solid #000; background: linear-gradient(#5a3d27, #3a2a1d); box-shadow: inset 1px 1px 0 var(--line-hi); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.primary { background: linear-gradient(#6c8f3a, #4b6b25); }
.btn.danger { background: linear-gradient(#a33a3a, #7a2525); }
.btn.jev { background: linear-gradient(#7a52c0, #553393); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.sm { min-height: 30px; padding: 3px 9px; font-size: 13px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
#lista { border-right: 2px solid #000; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); }
#detalhe { overflow-y: auto; min-width: 0; display: flex; flex-direction: column; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  #lista { border-right: 0; }
  body.vendo #lista { display: none; }
  body:not(.vendo) main { display: flex; flex-direction: column; overflow-y: auto; }
  body:not(.vendo) #detalhe { order: -1; overflow: visible; flex: none; border-bottom: 2px solid #000; }
  body:not(.vendo) #lista { overflow: visible; flex: none; }
  nav.links .hide-sm { display: none; }
}

.box { background: var(--panel-2); border: 2px solid #000; border-radius: var(--r); box-shadow: inset 1px 1px 0 var(--line); padding: 10px; }
h2 { margin: 0 0 6px; font: 700 15px var(--f-pixel); color: var(--gold); letter-spacing: .04em; }
h3 { margin: 0; font-size: 15px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.dim { color: var(--dim); font-size: 12.5px; }
.mono { font-family: var(--f-mono); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
select, input[type="text"], textarea { background: #0f0a07; border: 2px solid #000; border-radius: var(--r); box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 var(--line); padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.seg { display: flex; border: 2px solid #000; border-radius: var(--r); overflow: hidden; }
.seg button { flex: 1; padding: 7px 8px; background: var(--panel-3); border: 0; color: var(--muted); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #000; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 3px; border: 1px solid #000; font-size: 11.5px; font-weight: 700; color: #000; white-space: nowrap; }
.st-rodando, .st-executando, .st-planejando, .st-revisando, .st-ajustando, .st-resolvendo { background: var(--info); }
.st-aguardando, .st-aguardando_voce, .st-plano_pronto, .st-conflito { background: var(--warn); }
.st-concluida, .st-juntada, .st-entregue { background: var(--ok); }
.st-erro { background: var(--bad); }
.st-parada, .st-interrompida, .st-descartada, .st-esperando, .st-sem_mudancas { background: #9c8f7d; }
.tool { background: #e8dcc8; }
.bar { height: 6px; background: #000; border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }

.ferr { display: flex; gap: 6px; flex-wrap: wrap; }
.ferr span { font-size: 12px; padding: 2px 8px; border-radius: 3px; background: var(--panel-3); border: 1px solid #000; }
.ferr .ok::before { content: "● "; color: var(--ok); }
.ferr .no::before { content: "● "; color: var(--bad); }

.item { display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; background: var(--panel-2); border: 2px solid #000; border-radius: var(--r); padding: 9px 10px; box-shadow: inset 1px 1px 0 var(--line); }
.item.sel { box-shadow: inset 0 0 0 2px var(--gold); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pend { background: var(--warn); color: #000; border-radius: var(--r); padding: 8px 10px; font-weight: 700; border: 2px solid #000; width: 100%; text-align: left; }

/* detalhe */
.dhead { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 2px solid #000; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.mp-cam { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
.mp-cam.off { opacity: .5; }
.mp-cam input[type=checkbox] { width: 20px; height: 20px; margin-top: 8px; accent-color: var(--gold); }
.mp-cam input[type=text] { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; margin-bottom: 4px; }
.mp-cam input.dim { font-size: 13px; }
.mp-cam .col { display: flex; flex-direction: column; gap: 2px; }
#mpNova { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; min-width: 0; }
.eq.foco { box-shadow: inset 0 0 0 2px var(--gold); }
.fontes { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.fonte { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-top: 1px solid var(--line); }
.fonte.off { opacity: .7; }
.add-fonte summary { list-style: none; display: inline-block; margin-top: 4px; }
.add-fonte summary::-webkit-details-marker { display: none; }
.add-fonte textarea, .eq input[type=text] { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin: 6px 0; }
.achado pre.diff { max-height: 220px; }
.testes { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.teste { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.teste .ti { font-weight: 700; width: 16px; text-align: center; }
.teste code { display: block; font-size: 12px; overflow-wrap: anywhere; }
.teste pre.diff { max-height: 200px; }
.as-q { padding: 8px 0; border-top: 1px solid var(--line); }
.as-qt { font-weight: 600; margin-bottom: 4px; }
.as-op { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.as-op label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer; min-height: 36px; }
.as-op label:has(input:checked) { border-color: var(--gold); background: var(--panel-3); }
.as-outra { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.as-brief ul { margin: 4px 0 8px; padding-left: 20px; }
.as-t { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.as-ag { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 36px; }
.as-ag .x { background: none; border: 0; padding: 0 2px; font-weight: 700; color: #000; }
.as-ag select { max-width: 180px; }
.bar i.indet { animation: indet 1.4s ease-in-out infinite; }
@keyframes indet { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
#mpStatus { scroll-margin-top: 100px; }
.mp-jev { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13.5px; }
.dbody { padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.composer { position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid #000; padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 44px; max-height: 40vh; }
.vazio { margin: auto; text-align: center; color: var(--muted); padding: 40px 16px; max-width: 480px; }
.vazio h2 { font-size: 20px; }

.ev { max-width: 100%; }
.ev.voce { align-self: flex-end; background: #2f3d22; border: 2px solid #000; border-radius: 10px 10px 2px 10px; padding: 8px 11px; max-width: min(640px, 92%); white-space: pre-wrap; }
.ev.texto { background: var(--panel-2); border: 2px solid #000; border-radius: 10px 10px 10px 2px; padding: 8px 11px; max-width: min(760px, 96%); white-space: pre-wrap; overflow-wrap: anywhere; }
.ev.texto.sub { opacity: .75; font-size: 13.5px; }
.ev.ferr-ev { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding: 2px 4px; display: flex; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
.ev.ferr-ev .ic { flex: none; width: 1.2em; text-align: center; }
.ev.ferr-ev.err { color: var(--bad); }
.ev.ferr-ev details { flex: 1; min-width: 0; }
.ev.ferr-ev summary { cursor: pointer; list-style: none; }
.ev.ferr-ev summary::-webkit-details-marker { display: none; }
.ev.ferr-ev pre { margin: 4px 0 0; background: #0b0806; border: 1px solid #000; padding: 6px 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; color: var(--ink); }
.ev.aviso { font-size: 13px; color: var(--gold); padding: 2px 4px; }
.ev.fim { border: 2px solid #000; border-radius: var(--r); padding: 8px 11px; background: #1f2e1f; }
.ev.fim.err { background: #3a1818; }
.card-perm { background: #3a3010; border: 2px solid var(--warn); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.card-perm.feito { background: var(--panel-2); border-color: #000; opacity: .8; }
.card-perm code, .cmd { font-family: var(--f-mono); background: #0b0806; border: 1px solid #000; padding: 6px 8px; display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: #fff; font-size: 13px; }
.risco { font-size: 13px; color: #ffd0d0; }
.plano { background: var(--panel-2); border: 2px solid #000; border-radius: var(--r); padding: 8px 11px; }
.plano ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.plano li::before { content: "☐ "; color: var(--dim); }
.plano li.completed { color: var(--dim); text-decoration: line-through; }
.plano li.completed::before { content: "☑ "; color: var(--ok); }
.plano li.in_progress { color: var(--gold); }
.plano li.in_progress::before { content: "▶ "; color: var(--gold); }
.rev { border: 2px solid #000; border-radius: var(--r); padding: 8px 11px; background: #2a1f3a; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }

.diff { font-family: var(--f-mono); font-size: 12.5px; background: #0b0806; border: 2px solid #000; border-radius: var(--r); padding: 8px; overflow: auto; max-height: 70vh; white-space: pre; margin: 0; }
.diff .a { color: #7ee787; } .diff .r { color: #ff9b9b; } .diff .h { color: var(--info); } .diff .f { color: var(--gold); font-weight: 700; }

.tarefa-plano { border: 2px solid #000; border-radius: var(--r); background: var(--panel-2); padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.tarefa-plano .desc { font-size: 13px; color: var(--muted); white-space: pre-wrap; }
.log { font-size: 12.5px; color: var(--muted); max-height: 160px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 2px; }

dialog { background: var(--panel); color: var(--ink); border: 2px solid #000; border-radius: var(--r); box-shadow: 0 0 0 2px var(--line); max-width: min(560px, 94vw); width: 100%; padding: 14px; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #000; border: 2px solid var(--line); padding: 8px 14px; border-radius: var(--r); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: 92vw; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>CENTRAL</h1>
    <div class="sub"><span class="live" id="live"></span><span id="subline">Conectando…</span></div>
  </div>
  <nav class="links">
    <a class="btn sm" href="#/k">Equipe</a>
    <a class="btn sm" href="/escritorio">Escritório</a>
    <a class="btn sm hide-sm" href="/mapas">Mapas</a>
    <a class="btn sm hide-sm" href="/" title="Catálogo de agentes">Catálogo</a>
  </nav>
</header>
<main>
  <section id="lista" aria-label="Projetos, tarefas e coordenações"></section>
  <section id="detalhe" aria-live="polite"></section>
</main>

<dialog id="dlgProjeto">
  <form method="dialog" id="formProjeto">
    <h2>Projeto</h2>
    <div class="seg" role="group" aria-label="Tipo">
      <button type="button" data-modo="novo" aria-pressed="true">Novo</button>
      <button type="button" data-modo="pasta" aria-pressed="false">Pasta existente</button>
    </div>
    <label class="f" id="fNome">Nome<input type="text" name="nome" autocomplete="off" placeholder="minha-primeira-app"></label>
    <label class="f" id="fPasta" hidden>Caminho completo da pasta<input type="text" name="pasta" autocomplete="off" placeholder="C:\Users\paulo\projetos\meu-app"></label>
    <p class="dim" id="dicaProjeto"></p>
    <div class="row"><span class="grow"></span><button class="btn ghost" value="cancel" type="submit">Cancelar</button><button class="btn primary" value="ok" type="submit" id="okProjeto">Criar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const TOKEN = document.querySelector('meta[name="leradeveloper-token"]')?.getAttribute("content") ?? "dev";
  async function api(cmd, args = {}) {
    const r = await fetch(`/api/invoke/${cmd}`, { method: "POST", headers: { "Content-Type": "application/json", "X-Leradeveloper-Token": TOKEN }, body: JSON.stringify(args) });
    const body = await r.json().catch(() => null);
    if (!r.ok) throw new Error(body?.message ?? `HTTP ${r.status}`);
    return body;
  }
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem storage */ } } };
  const rtf = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
  const ago = (iso) => {
    const s = Math.round((Date.parse(iso) - Date.now()) / 1000);
    if (!Number.isFinite(s)) return "";
    if (Math.abs(s) < 45) return "agora";
    if (Math.abs(s) < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (Math.abs(s) < 86400) return rtf.format(Math.round(s / 3600), "hour");
    return rtf.format(Math.round(s / 86400), "day");
  };
  const usd = (v) => (v ? `US$ ${Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 4 })}` : "");
  const pct = (p) => `${Math.round(p * 100)}%`;
  let toastT;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
  async function acao(fn, ok) { try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message); return null; } }

  const STATUS = {
    rodando: "trabalhando", aguardando: "pede você", concluida: "concluída", erro: "erro", parada: "parada", interrompida: "interrompida",
    planejando: "planejando", plano_pronto: "plano pronto", executando: "executando", entregue: "entregue", descartada: "descartada",
    esperando: "esperando", revisando: "revisando", ajustando: "ajustando", aguardando_voce: "pede você", juntada: "juntada", conflito: "conflito", resolvendo: "resolvendo", sem_mudancas: "sem mudanças",
  };
  const AUT = { editar: "Editar livre, comandos pedem", perguntar: "Tudo pede aprovação", jev: "Automático com o Jev" };
  const chip = (s) => `<span class="chip st-${esc(s)}">${esc(STATUS[s] ?? s)}</span>`;

  // ---------------- estado ----------------
  let estado = null;
  let coords = [];
  let projetoSel = store.get("lera.central.projeto");
  let modo = store.get("lera.central.modo") || "assistente";
  let rota = parseHash();
  let online = true;
  let pendentesAntes = 0;

  function parseHash() {
    const k = /^#\/k(?:\/(.+))?$/.exec(location.hash);
    if (k) return { tipo: "k", id: k[1] ? decodeURIComponent(k[1]) : null };
    const m = /^#\/(t|c|p|a)\/([\w-]+)/.exec(location.hash);
    return m ? { tipo: m[1], id: m[2] } : null;
  }
  window.addEventListener("hashchange", () => { rota = parseHash(); detalheCache = null; asCache = null; renderTudo(); });
  const ir = (h) => { location.hash = h; };

  async function carregar() {
    try {
      estado = await api("central_estado");
      coords = await api("coord_listar", {});
      assistentes = await api("assistente_listar", {}).catch(() => []);
      online = true;
    } catch {
      online = false;
    }
    $("#live").classList.toggle("off", !online);
    if (!estado) { $("#subline").textContent = "Sem conexão com o servidor do PC"; return; }
    if (!projetoSel || !estado.projetos.some((p) => p.id === projetoSel)) projetoSel = estado.projetos[0]?.id ?? null;
    const pend = estado.tarefas.reduce((a, t) => a + t.pendentes.length, 0) + coords.reduce((a, c) => a + Object.values(c.execucao ?? {}).filter((e) => ["aguardando_voce", "conflito"].includes(e.status)).length + (c.status === "plano_pronto" ? 1 : 0), 0);
    $("#subline").textContent = online ? `${estado.tarefas.filter((t) => t.rodando).length} rodando · ${pend} pedem você` : "Sem conexão";
    if (pend > pendentesAntes) notificar(pend);
    pendentesAntes = pend;
    renderLista();
    if (!rota) renderComposer();
  }

  function notificar(n) {
    document.title = `(${n}) Central · leradev`;
    try { navigator.vibrate?.(120); } catch { /* ok */ }
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      try { new Notification("leradev", { body: `${n} pedido(s) esperando você na Central.`, tag: "lera-central" }); } catch { /* ok */ }
    }
  }

  // ---------------- lista ----------------
  function renderLista() {
    const el = $("#lista");
    const fer = estado.ferramentas;
    const projs = estado.projetos;
    const tarefas = estado.tarefas.filter((t) => !t.coordId && (!projetoSel || t.projetoId === projetoSel));
    const cs = coords.filter((c) => !projetoSel || c.projetoId === projetoSel);
    const pendT = estado.tarefas.filter((t) => t.pendentes.length);
    el.innerHTML = `
      <div class="box">
        <div class="row"><h2 class="grow">Projeto</h2>${rota ? `<button class="btn sm primary" data-ir="#/" type="button">+ Conversa</button>` : ""}<button class="btn sm" id="btnProjeto" type="button">+ Projeto</button></div>
        ${projs.length ? `<select id="selProjeto" aria-label="Projeto">${projs.map((p) => `<option value="${esc(p.id)}"${p.id === projetoSel ? " selected" : ""}>${esc(p.nome)}</option>`).join("")}</select>
          <div class="dim mono" style="margin-top:4px;overflow-wrap:anywhere">${esc(projs.find((p) => p.id === projetoSel)?.pasta ?? "")}</div>
          <div class="row" style="margin-top:6px"><button class="btn sm${rota?.tipo === "p" ? " primary" : ""}" data-ir="#/p/${esc(projetoSel)}" type="button">🗺 Mapa de arquitetura</button><button class="btn sm jev" id="btnPreviaProj" type="button">▶ Prévia</button></div>`
        : `<p class="muted">Nenhum projeto ainda. Toque em <strong>+ Projeto</strong>.</p>`}
        <div class="ferr" style="margin-top:8px">${Object.values(fer).map((f) => `<span class="${f.ok ? "ok" : "no"}" title="${esc(f.ok ? f.versao : `Não encontrado. ${f.instalar}`)}">${esc(f.nome)}</span>`).join("")}</div>
      </div>
      <div class="box" id="boxContas">${renderContas()}</div>
      ${pendT.length ? pendT.map((t) => `<button class="pend" data-ir="#/t/${esc(t.id)}">⚠ ${esc(t.nomeFerramenta)} pede: ${esc(t.pendentes[0].comando ?? t.pendentes[0].ferramenta)}</button>`).join("") : ""}
      ${(() => { const as = assistentes.filter((a) => !a.coordId && (!projetoSel || a.projetoId === projetoSel)); return as.length ? `<h2>Com o assistente</h2>${as.map(itemAssistente).join("")}` : ""; })()}
      ${cs.length ? `<h2>Objetivos</h2>${cs.map((c) => itemCoord(c)).join("")}` : ""}
      ${tarefas.length ? `<h2>Tarefas</h2>${tarefas.map((t) => itemTarefa(t)).join("")}` : projs.length ? `<p class="dim">As tarefas aparecem aqui.</p>` : ""}
      ${"Notification" in window && Notification.permission === "default" ? `<button class="btn ghost sm" id="btnNotif" type="button">Avisar quando uma ferramenta pedir você</button>` : ""}
    `;
    $("#btnProjeto")?.addEventListener("click", abrirProjeto);
    $("#btnPreviaProj")?.addEventListener("click", () => abrirPrevia({ projetoId: projetoSel }, "prévia do projeto"));
    ligarContas();
    $("#selProjeto")?.addEventListener("change", (e) => { projetoSel = e.target.value; store.set("lera.central.projeto", projetoSel); if (rota?.tipo === "p") { ir(`#/p/${projetoSel}`); return; } renderLista(); if (!rota) renderComposer(true); });
    $("#btnNotif")?.addEventListener("click", async () => { await Notification.requestPermission(); renderLista(); });
    el.querySelectorAll("[data-ir]").forEach((b) => b.addEventListener("click", () => ir(b.dataset.ir)));
  }

  // ---------------- contas e limites ----------------
  let contasDados = null, contasQuando = 0, contasCarregando = false;
  async function carregarContas(atualizar = false) {
    if (contasCarregando) return;
    contasCarregando = true;
    try {
      contasDados = await api("central_contas", { atualizar });
      contasQuando = Date.now();
    } catch { /* tenta depois */ }
    contasCarregando = false;
    const box = $("#boxContas");
    if (box) { box.innerHTML = renderContas(); ligarContas(); }
  }
  const quando = (ms) => {
    if (!ms) return "";
    const d = new Date(Number(ms));
    const dias = Math.round((d - Date.now()) / 864e5);
    return dias >= 1 ? `renova em ${dias} dia${dias > 1 ? "s" : ""}` : `renova às ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
  };
  function barra(rotulo, uso, extra) {
    const p = Math.round((Number(uso) || 0) * 100);
    const cor = p >= 90 ? "var(--bad)" : p >= 70 ? "var(--warn)" : "var(--ok)";
    return `<div class="dim" style="display:flex;justify-content:space-between;gap:6px"><span>${esc(rotulo)} <b style="color:var(--ink)">${p}%</b></span><span>${esc(extra ?? "")}</span></div><div class="bar"><i style="width:${p}%;background:${cor}"></i></div>`;
  }
  function renderContas() {
    if (!contasDados) return `<div class="row"><h2 class="grow">Contas e limites</h2></div><p class="dim">Carregando…</p>`;
    const linhas = Object.values(contasDados).filter((c) => c.instalado).map((c) => {
      const j = c.janelas ?? {};
      const partes = [];
      if (j.five_hour) partes.push(barra("Sessão (5 h)", j.five_hour.uso, quando(j.five_hour.renova)));
      if (j.seven_day) partes.push(barra("Semana", j.seven_day.uso, quando(j.seven_day.renova)));
      if (c.limiteMensal) partes.push(barra("Mês (seu limite)", c.usoMensal, `${c.uso.mes} de ${c.limiteMensal} pedidos`));
      const semJanelas = !j.five_hour && !j.seven_day;
      return `<div style="display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px dashed var(--line)">
        <div class="row"><strong class="grow">${esc(c.nome)}</strong>${c.perto ? `<span class="chip st-erro">perto do limite</span>` : ""}<button class="btn ghost sm" data-limite="${esc(c.id)}" title="Definir quantos pedidos por mês você quer usar">limite</button></div>
        <div class="dim">${esc(c.descricao ?? "")}${c.email && !String(c.descricao ?? "").includes(c.email) ? ` · ${esc(c.email)}` : ""}</div>
        ${c.alerta ? `<div class="risco">${esc(c.alerta)}</div>` : ""}
        ${partes.join("")}
        <div class="dim">${c.uso.dia} hoje · ${c.uso.semana} na semana · ${c.uso.mes} no mês pela Central${c.uso.custoMesUsd ? ` · ${esc(usd(c.uso.custoMesUsd))}` : ""}${c.uso.tokensMes ? ` · ${c.uso.tokensMes.toLocaleString("pt-BR")} tokens` : ""}</div>
        ${semJanelas && c.id === "claude" ? `<div class="dim">Os limites de 5 h e da semana aparecem depois da primeira tarefa.</div>` : ""}
        ${semJanelas && (c.id === "cursor" || c.id === "antigravity") && !c.limiteMensal ? `<div class="dim">Esta ferramenta não informa o uso por fora; defina um limite mensal para o Jev respeitar.</div>` : ""}
      </div>`;
    });
    return `<div class="row"><h2 class="grow">Contas e limites</h2><button class="btn ghost sm" id="btnContas" type="button">${contasCarregando ? "…" : "Atualizar"}</button></div>
      ${linhas.join("") || `<p class="dim">Nenhuma ferramenta instalada.</p>`}
      <p class="dim" style="margin:4px 0 0">Ferramenta com 90% ou mais de uso fica fora da escolha automática.</p>`;
  }
  function ligarContas() {
    $("#btnContas")?.addEventListener("click", () => carregarContas(true));
    document.querySelectorAll("[data-limite]").forEach((b) => b.addEventListener("click", async () => {
      const c = contasDados?.[b.dataset.limite];
      const v = prompt(`Quantos pedidos por mês você quer usar no ${c?.nome ?? b.dataset.limite}? (deixe vazio para tirar o limite)`, c?.limiteMensal ?? "");
      if (v == null) return;
      await acao(() => api("central_limite_definir", { ferramenta: b.dataset.limite, mensal: v.trim() || null }), "Limite salvo.");
      carregarContas();
    }));
  }

  function itemTarefa(t) {
    const sel = rota?.tipo === "t" && rota.id === t.id;
    return `<button class="item${sel ? " sel" : ""}" data-ir="#/t/${esc(t.id)}">
      <div class="row"><span class="chip tool">${esc(t.nomeFerramenta)}</span>${chip(t.status)}<span class="dim" style="margin-left:auto">${esc(ago(t.atualizado))}</span></div>
      <div class="t">${esc(t.titulo)}</div>
      ${t.ultimaMensagem ? `<div class="m">${esc(t.ultimaMensagem)}</div>` : ""}
      <div class="bar"><i style="width:${t.progresso}%;background:${t.status === "erro" ? "var(--bad)" : t.status === "aguardando" ? "var(--warn)" : "var(--ok)"}"></i></div>
    </button>`;
  }
  function itemCoord(c) {
    const sel = rota?.tipo === "c" && rota.id === c.id;
    const ex = Object.values(c.execucao ?? {});
    const feitas = ex.filter((e) => ["juntada", "sem_mudancas", "descartada"].includes(e.status)).length;
    const total = c.plano?.tarefas?.length ?? 0;
    return `<button class="item${sel ? " sel" : ""}" data-ir="#/c/${esc(c.id)}">
      <div class="row"><span class="chip tool">Time</span>${chip(c.status)}<span class="dim" style="margin-left:auto">${esc(ago(c.atualizado))}</span></div>
      <div class="t">${esc(c.objetivo.split("\n")[0])}</div>
      <div class="m">${esc(c.log?.at(-1)?.texto ?? "")}</div>
      ${total ? `<div class="bar"><i style="width:${Math.round((feitas / total) * 100)}%"></i></div>` : ""}
    </button>`;
  }

  // Escolhas do compositor sobrevivem às atualizações automáticas.
  let escolhaFerr = store.get("lera.central.ferr") || "auto";
  let escolhaAut = null;
  let escolhaAgentes = store.get("lera.central.agentes") || null;
  let assinaturaComposer = "";

  function renderComposer(forcar = false) {
    if (!estado) return;
    const projs = estado.projetos;
    const fer = estado.ferramentas;
    const assinatura = JSON.stringify([modo, projetoSel, projs.map((p) => p.id), Object.values(fer).map((f) => f.ok)]);
    if (!forcar && assinatura === assinaturaComposer && $("#composerNovo")) return;
    assinaturaComposer = assinatura;
    const det = $("#detalhe");
    if (!projs.length) {
      det.innerHTML = `<div class="vazio">
        <h2>Central de comando</h2>
        <p>Aqui você conversa com o Claude Code, o Codex e o Cursor que estão no seu PC.</p>
        <p><strong>Primeiro passo:</strong> escolha a pasta onde eles vão trabalhar.</p>
        <div class="acoes" style="justify-content:center"><button class="btn primary" id="cNovoProj">Criar projeto novo</button><button class="btn" id="cPastaProj">Usar pasta existente</button></div>
      </div>`;
      $("#cNovoProj").onclick = () => abrirProjeto("novo");
      $("#cPastaProj").onclick = () => abrirProjeto("pasta");
      return;
    }
    const p = projs.find((x) => x.id === projetoSel) ?? projs[0];
    const draft = $("#novoTexto")?.value ?? store.get("lera.central.rascunho") ?? "";
    const aut = escolhaAut ?? estado.autonomia;
    escolhaAgentes ??= estado.agentes ?? "auto";
    det.innerHTML = `<div class="dbody" id="composerNovo" style="max-width:860px;width:100%;margin:0 auto">
      <div class="row"><h2 class="grow" style="font-size:18px;margin:0">Nova conversa</h2><span class="dim">em <strong>${esc(p.nome)}</strong></span></div>
      <div class="seg" role="group" aria-label="Modo">
        <button type="button" data-modo="assistente" aria-pressed="${modo === "assistente"}">Com o assistente</button>
        <button type="button" data-modo="tarefa" aria-pressed="${modo === "tarefa"}">Tarefa (uma ferramenta)</button>
        <button type="button" data-modo="objetivo" aria-pressed="${modo === "objetivo"}">Objetivo (o time divide)</button>
      </div>
      <textarea id="novoTexto" rows="7" style="font-size:16px" placeholder="${modo === "assistente"
        ? "Conte a sua ideia do jeito que vier. O assistente lê o projeto, pergunta só o que importa, monta o briefing (critérios, validações) e a equipe: que ferramenta e que agentes fazem cada parte. O Jev valida antes de começar.\nEx.: quero um app de lista de tarefas para usar no celular."
        : modo === "tarefa"
        ? "Escreva aqui o que a ferramenta deve fazer, como numa conversa.\nEx.: crie um index.html com uma lista de tarefas que salva no navegador e fica bonita no celular."
        : "Escreva o objetivo maior. O coordenador monta um plano, você aprova e o time trabalha em paralelo.\nEx.: app de lista de tarefas com tela bonita no celular, testes e README."}">${esc(draft)}</textarea>
      <div class="row"${modo === "assistente" ? ' style="display:none"' : ""}>
        ${modo === "tarefa" ? `<label class="f grow">Ferramenta<select id="novoFerr">
          <option value="auto"${escolhaFerr === "auto" ? " selected" : ""}>Automático (o Jev escolhe)</option>
          ${Object.values(fer).map((f) => `<option value="${esc(f.id)}"${f.ok ? "" : " disabled"}${escolhaFerr === f.id ? " selected" : ""}>${esc(f.nome)}${f.ok ? "" : " (não instalado)"}</option>`).join("")}
        </select></label>` : ""}
        <label class="f grow">Autonomia<select id="novoAut">${Object.entries(AUT).map(([k, v]) => `<option value="${k}"${k === aut ? " selected" : ""}>${v}</option>`).join("")}</select></label>
        <label class="f grow">Agentes do catálogo<select id="novoAgentes">
          <option value="auto"${escolhaAgentes === "auto" ? " selected" : ""}>Automático (o Jev liga os úteis)</option>
          <option value="nenhum"${escolhaAgentes === "nenhum" ? " selected" : ""}>Nenhum</option>
        </select></label>
      </div>
      ${!estado.jevAtivo && escolhaAgentes === "auto" ? `<p class="dim">Sem a chave do Jev, nenhum agente é ligado automaticamente.</p>` : ""}
      <button class="btn primary" style="min-height:48px;font-size:16px" id="btnMandar" type="button">${modo === "assistente" ? "Conversar com o assistente ▸" : modo === "tarefa" ? "Mandar ▸" : "Planejar com o time ▸"}</button>
      <p class="dim">Depois de mandar, abre a conversa: você acompanha ao vivo, aprova comandos e continua conversando na caixa de baixo. Ctrl+Enter também envia.</p>
      ${modo === "tarefa" && escolhaFerr === "cursor" ? `<p class="dim">O Cursor roda em modo automático: aplica mudanças e roda comandos sem pedir aprovação.</p>` : ""}
    </div>`;
    det.querySelectorAll(".seg [data-modo]").forEach((b) => b.addEventListener("click", () => { modo = b.dataset.modo; store.set("lera.central.modo", modo); renderComposer(true); }));
    const ta = $("#novoTexto");
    ta.addEventListener("input", () => store.set("lera.central.rascunho", ta.value));
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); mandar(); } });
    $("#novoFerr")?.addEventListener("change", (e) => { escolhaFerr = e.target.value; store.set("lera.central.ferr", escolhaFerr); renderComposer(true); });
    $("#novoAut").addEventListener("change", (e) => { escolhaAut = e.target.value; });
    $("#novoAgentes").addEventListener("change", (e) => { escolhaAgentes = e.target.value; store.set("lera.central.agentes", escolhaAgentes); renderComposer(true); });
    $("#btnMandar").addEventListener("click", mandar);
  }

  async function mandar() {
    const texto = $("#novoTexto").value.trim();
    if (!texto) return toast("Escreva o que deve ser feito.");
    const btn = $("#btnMandar");
    btn.disabled = true;
    btn.textContent = modo === "assistente" ? "Chamando o assistente…" : modo === "tarefa" ? (escolhaAgentes === "auto" && estado.jevAtivo ? "O Jev está escolhendo…" : "Mandando…") : "Planejando…";
    const aut = $("#novoAut").value;
    const r = modo === "assistente"
      ? await acao(() => api("assistente_criar", { projetoId: projetoSel, ideia: texto }))
      : modo === "tarefa"
      ? await acao(() => api("tarefa_criar", { projetoId: projetoSel, ferramenta: $("#novoFerr").value, prompt: texto, autonomia: aut, agentes: escolhaAgentes }))
      : await acao(() => api("coord_criar", { projetoId: projetoSel, objetivo: texto, autonomia: aut, agentes: escolhaAgentes }));
    if (r) {
      store.set("lera.central.rascunho", "");
      $("#novoTexto").value = "";
      assinaturaComposer = "";
      ir(modo === "assistente" ? `#/a/${r.id}` : modo === "tarefa" ? `#/t/${r.id}` : `#/c/${r.id}`);
      await carregar();
    } else btn.disabled = false;
  }

  // ---------------- projeto ----------------
  function abrirProjeto(inicial = "novo") {
    const dlg = $("#dlgProjeto");
    const f = $("#formProjeto");
    let m = typeof inicial === "string" ? inicial : "novo";
    const upd = () => {
      f.querySelectorAll("[data-modo]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.modo === m)));
      $("#fPasta").hidden = m !== "pasta";
      $("#okProjeto").textContent = m === "novo" ? "Criar" : "Adicionar";
      $("#dicaProjeto").textContent = m === "novo" ? `A pasta será criada em ${estado.raiz}, com git.` : "A pasta continua onde está; o leradev só passa a trabalhar nela.";
    };
    f.querySelectorAll("[data-modo]").forEach((b) => (b.onclick = () => { m = b.dataset.modo; upd(); }));
    upd();
    f.reset();
    dlg.showModal();
    dlg.onclose = async () => {
      if (dlg.returnValue !== "ok") return;
      const nome = f.nome.value.trim();
      const pasta = f.pasta.value.trim();
      const p = m === "novo" ? await acao(() => api("projeto_criar", { nome }), "Projeto criado.") : await acao(() => api("projeto_adicionar", { pasta, nome }), "Pasta adicionada.");
      if (p) { projetoSel = p.id; store.set("lera.central.projeto", p.id); await carregar(); if (!rota) renderComposer(true); }
    };
  }

  // ---------------- detalhe da tarefa ----------------
  let detalheCache = null; // { id, desde, eventos, tarefa }
  async function carregarTarefa() {
    if (rota?.tipo !== "t") return;
    const id = rota.id;
    if (!detalheCache || detalheCache.id !== id) detalheCache = { id, desde: 0, eventos: [], tarefa: null };
    try {
      const r = await api("tarefa_eventos", { id, desde: detalheCache.desde });
      if (detalheCache.id !== id) return;
      detalheCache.tarefa = r.tarefa;
      if (r.eventos.length) {
        detalheCache.eventos.push(...r.eventos);
        detalheCache.desde = r.eventos.at(-1).n;
      }
      renderTarefa(r.eventos.length > 0);
    } catch (e) {
      $("#detalhe").innerHTML = `<div class="vazio"><h2>Não encontrei</h2><p>${esc(e.message)}</p><button class="btn" data-voltar>Voltar</button></div>`;
      $("#detalhe [data-voltar]").onclick = () => ir("#/");
    }
  }

  function renderTarefa(novos) {
    const { tarefa: t, eventos } = detalheCache;
    const det = $("#detalhe");
    const perto = det.scrollHeight - det.scrollTop - det.clientHeight < 160;
    const draft = $("#msgTexto")?.value ?? "";
    const foco = document.activeElement?.id === "msgTexto";
    const resol = new Map(eventos.filter((e) => e.t === "permissao_resolvida").map((e) => [e.pedidoId, e]));
    const riscos = new Map(eventos.filter((e) => e.t === "risco").map((e) => [e.pedidoId, e]));
    const fins = new Map(eventos.filter((e) => e.t === "ferramenta_fim").map((e) => [e.id, e]));
    const planoUlt = [...eventos].reverse().find((e) => e.t === "plano");
    const corpo = [];
    for (const e of eventos) {
      if (e.t === "voce") corpo.push(`<div class="ev voce">${esc(e.texto)}</div>`);
      else if (e.t === "texto") corpo.push(`<div class="ev texto${e.sub ? " sub" : ""}">${esc(e.texto)}</div>`);
      else if (e.t === "ferramenta") {
        const f = fins.get(e.id);
        const ic = e.nome === "Bash" || e.nome === "Comando" || e.nome === "PowerShell" ? "▸" : /edit|Write|Escrever|Editar|Edição/i.test(e.nome) ? "✎" : "·";
        const resumo = relativo(e.resumo, t.cwd);
        corpo.push(`<div class="ev ferr-ev${f && !f.ok ? " err" : ""}"><span class="ic">${ic}</span>${f?.saida ? `<details><summary>${esc(resumo)}</summary><pre>${esc(f.saida)}</pre></details>` : `<span>${esc(resumo)}${f ? "" : " …"}</span>`}</div>`);
      } else if (e.t === "aviso") corpo.push(`<div class="ev aviso">${esc(e.texto)}</div>`);
      else if (e.t === "agentes") {
        const ok = e.itens.filter((a) => !a.erro);
        corpo.push(`<div class="ev aviso">Especialistas ligados: ${ok.map((a) => `<span class="chip tool" title="${esc(a.slug)}">${esc(a.emoji ?? "")} ${esc(a.nome)}${a.prob ? ` ${pct(a.prob)}` : ""}</span>`).join(" ") || "nenhum"}${ok.some((a) => a.temporario) ? ` <span class="dim">(saem do projeto quando a tarefa termina)</span>` : ""}${e.itens.filter((a) => a.erro).map((a) => `<div class="risco">${esc(a.nome)}: ${esc(a.erro)}</div>`).join("")}</div>`);
      }
      else if (e.t === "permissao") {
        const r = resol.get(e.pedidoId);
        const rs = riscos.get(e.pedidoId);
        const pendente = !r && t.pendentes.some((p) => p.id === e.pedidoId);
        corpo.push(`<div class="card-perm${pendente ? "" : " feito"}">
          <div class="row"><strong class="grow">${pendente ? `${esc(t.nomeFerramenta)} pede para ${e.comando ? "rodar" : "usar"}:` : "Pedido"}</strong>${e.arriscado ? `<span class="chip st-erro">arriscado</span>` : ""}</div>
          ${e.comando ? `<code>${esc(e.comando)}</code>` : `<div>${esc(e.ferramenta)}${e.detalhe ? ` · <span class="dim">${esc(e.detalhe)}</span>` : ""}</div>`}
          ${rs ? `<div class="risco">Jev: ${pct(rs.destrutivo)} de chance de ser destrutivo, ${pct(rs.externo)} de afetar algo fora da cópia local.</div>` : e.arriscado && pendente && estado?.jevAtivo ? `<div class="risco dim">Consultando o Jev…</div>` : e.arriscado && pendente ? `<div class="risco">Comando da lista de arriscados. Confira antes de permitir.</div>` : ""}
          ${pendente ? `<div class="acoes"><button class="btn primary" data-resp="permitir" data-p="${esc(e.pedidoId)}">Permitir</button><button class="btn" data-resp="sempre" data-p="${esc(e.pedidoId)}" title="Permite comandos que começam igual, só nesta tarefa">Sempre nesta tarefa</button><button class="btn danger" data-resp="negar" data-p="${esc(e.pedidoId)}">Negar</button></div>`
            : `<div class="dim">${r ? (r.decisao === "negar" ? "Negado" : "Permitido") + (r.motivo && r.motivo !== "você" ? ` (${esc(r.motivo)})` : "") : "Expirou"}</div>`}
        </div>`);
      } else if (e.t === "permissao_resolvida" && !eventos.some((x) => x.t === "permissao" && x.pedidoId === e.pedidoId)) {
        corpo.push(`<div class="ev ferr-ev"><span class="ic">✓</span><span>${esc(e.comando ? `$ ${e.comando}` : e.ferramenta)}: permitido automaticamente (${esc(e.motivo)})</span></div>`);
      } else if (e.t === "revisao") {
        corpo.push(`<div class="rev"><strong>Revisão do Jev: ${esc({ aprovar: "aprovar", ajustar: "ajustar", refazer: "refazer", humano: "você decide" }[e.veredito] ?? e.veredito)}</strong>${e.risco ? ` <span class="dim">· risco ${esc(e.risco.split(":")[0].toLowerCase())}</span>` : ""}<ul>${(e.motivos ?? []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>`);
      } else if (e.t === "git") corpo.push(`<div class="ev aviso">git ${esc(e.acao)}${e.commit ? ` ${esc(e.commit)}` : ""}${e.mensagem ? `: ${esc(e.mensagem)}` : ""}</div>`);
      else if (e.t === "fim") corpo.push(`<div class="ev fim${e.ok ? "" : " err"}">${e.ok ? "✔ Terminou" : e.parada ? "■ Parada" : "✖ Não terminou"}${e.custoUsd ? ` · ${esc(usd(e.custoUsd))}` : ""}${e.tokens ? ` · ${e.tokens.toLocaleString("pt-BR")} tokens` : ""}${!e.ok && e.erro && !e.parada ? `<div class="dim">${esc(e.erro)}</div>` : ""}</div>`);
    }
    const terminou = !t.rodando;
    det.innerHTML = `
      <div class="dhead">
        <div class="row"><button class="btn sm ghost" data-voltar aria-label="Voltar">←</button><span class="chip tool">${esc(t.nomeFerramenta)}</span>${chip(t.status)}<span class="dim">${esc(AUT[t.autonomia] ?? "")}</span>
          <span class="grow"></span>${t.custoUsd ? `<span class="dim">${esc(usd(t.custoUsd))}</span>` : ""}${t.rodando ? `<button class="btn sm danger" id="btnParar">Parar</button>` : ""}</div>
        <h3>${esc(t.titulo)}</h3>
        ${t.rodando ? `<div class="bar"><i style="width:${t.progresso}%"></i></div>` : ""}
      </div>
      <div class="dbody">
        ${planoUlt ? `<div class="plano"><strong>Plano da ferramenta</strong><ul>${planoUlt.itens.map((i) => `<li class="${esc(i.status)}">${esc(i.texto)}</li>`).join("")}</ul></div>` : ""}
        ${corpo.join("")}
        ${terminou && !t.oculta ? `<div class="row" style="flex-wrap:wrap;gap:6px"><span class="dim">Agentes nas próximas mensagens:</span>${editorAgentes(Array.isArray(t.agentes) ? t.agentes : [], "t", true)}</div>` : ""}
        ${terminou ? `<div class="acoes"><button class="btn jev" id="btnPrevia">Abrir prévia</button><button class="btn" id="btnDiff">Ver mudanças</button><button class="btn jev" id="btnRevisar">Revisar com o Jev</button><button class="btn" id="btnCommit">Commit</button><button class="btn" id="btnPush">Push</button></div><div id="areaDiff"></div>` : ""}
      </div>
      <div class="composer">
        <textarea id="msgTexto" rows="1" placeholder="${t.rodando ? "Espere terminar…" : "Continuar a conversa…"}" ${t.rodando ? "disabled" : ""}>${esc(draft)}</textarea>
        <button class="btn primary" id="btnEnviar" ${t.rodando ? "disabled" : ""}>Enviar</button>
      </div>`;
    if (foco) { const x = $("#msgTexto"); x.focus(); x.setSelectionRange(x.value.length, x.value.length); }
    if (novos && perto) det.scrollTop = det.scrollHeight;
    det.querySelector("[data-voltar]").onclick = () => ir("#/");
    $("#btnParar")?.addEventListener("click", () => acao(() => api("tarefa_parar", { id: t.id }), "Parando…"));
    det.querySelectorAll("[data-resp]").forEach((b) => b.addEventListener("click", async () => {
      det.querySelectorAll(`[data-p="${b.dataset.p}"]`).forEach((x) => (x.disabled = true));
      await acao(() => api("tarefa_responder", { id: t.id, pedidoId: b.dataset.p, decisao: b.dataset.resp }));
      carregarTarefa();
    }));
    $("#btnEnviar").addEventListener("click", async () => {
      const txt = $("#msgTexto").value.trim();
      if (!txt) return;
      $("#msgTexto").value = "";
      await acao(() => api("tarefa_enviar", { id: t.id, prompt: txt }));
      carregarTarefa();
    });
    $("#btnPrevia")?.addEventListener("click", () => abrirPrevia({ tarefaId: t.id }));
    ligarEditorAgentes($("#detalhe"), () => (Array.isArray(t.agentes) ? t.agentes : []), async (_k, slugs) => { if (await acao(() => api("tarefa_agentes_definir", { id: t.id, agentes: slugs }), "Agentes atualizados.")) { detalheCache = null; carregarTarefa(); } });
    if (!catalogo && terminou) garantirCatalogo().then(() => { detalheCache = null; carregarTarefa(); });
    $("#btnDiff")?.addEventListener("click", async () => {
      const d = await acao(() => api("tarefa_diff", { id: t.id }));
      if (d) $("#areaDiff").innerHTML = renderDiff(d.diff, d.arquivos.map((a) => `${a.x} ${a.caminho}`));
    });
    $("#btnRevisar")?.addEventListener("click", async (ev) => {
      ev.target.disabled = true;
      ev.target.textContent = "Revisando…";
      await acao(() => api("tarefa_revisar", { id: t.id }));
      carregarTarefa();
    });
    $("#btnCommit")?.addEventListener("click", async () => {
      const msg = prompt("Mensagem do commit:", t.titulo);
      if (msg == null) return;
      const r = await acao(() => api("tarefa_commit", { id: t.id, mensagem: msg }));
      if (r) { toast(`Commit ${r.commit} feito.`); carregarTarefa(); }
    });
    $("#btnPush")?.addEventListener("click", async () => {
      if (!confirm("Enviar os commits para o GitHub (git push)?")) return;
      const r = await acao(() => api("tarefa_push", { id: t.id }));
      if (r) { toast(`Enviado (${r.branch}).`); carregarTarefa(); }
    });
  }

  /** Caminhos dentro do projeto aparecem relativos. */
  function relativo(texto, cwd) {
    if (!cwd) return texto;
    let out = String(texto);
    const semBarra = String(cwd).replace(/[\\/]+$/, "");
    for (const base of [semBarra + "\\", semBarra + "/", semBarra.replace(/\\/g, "/") + "/"]) out = out.split(base).join("");
    return out;
  }

  function renderDiff(diff, arquivos) {
    if (!diff.trim()) return `<p class="muted">Nenhuma mudança desde o último commit.</p>`;
    const linhas = diff.split("\n").map((l) => {
      const c = l.startsWith("diff --git") ? "f" : l.startsWith("@@") ? "h" : l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "r" : "";
      return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
    });
    return `${arquivos?.length ? `<p class="dim mono">${arquivos.map(esc).join("<br>")}</p>` : ""}<pre class="diff">${linhas.join("\n")}</pre>`;
  }

  // ---------------- detalhe da coordenação ----------------
  async function carregarCoord() {
    if (rota?.tipo !== "c") return;
    try {
      const c = await api("coord_obter", { id: rota.id });
      renderCoord(c);
    } catch (e) {
      $("#detalhe").innerHTML = `<div class="vazio"><h2>Não encontrei</h2><p>${esc(e.message)}</p></div>`;
    }
  }

  const NOMES = { claude: "Claude Code", codex: "Codex", cursor: "Cursor", antigravity: "Antigravity" };

  // ---------------- prévia (link para testar a entrega) ----------------
  function urlPrevia(p) {
    const local = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
    const base = local ? `http://127.0.0.1:${p.porta}` : (p.urlRemota || `https://${location.hostname}:8443`);
    return base.replace(/\/$/, "") + p.caminho;
  }
  async function abrirPrevia(args, rotulo = "prévia") {
    const w = window.open("about:blank", "_blank"); // abre já, para o navegador não bloquear
    const p = await acao(() => api("previa_abrir", args));
    if (!p) { w?.close(); return; }
    const url = urlPrevia(p);
    if (w) w.location = url; else location.href = url;
    toast(p.modo === "script" && p.status !== "pronta" ? `Preparando a ${rotulo} (${p.script})… a página atualiza sozinha.` : `Prévia aberta.`);
  }

  // ---------------- agentes do catálogo (agregar / desagregar) ----------------
  async function garantirCatalogo() {
    if (!catalogo) catalogo = await api("assistente_catalogo").catch(() => []);
    return catalogo;
  }
  function editorAgentes(lista, chave, editavel = true) {
    const chips = (lista ?? []).map((a) => `<span class="chip tool">${esc(a.emoji ? `${a.emoji} ` : "")}${esc(a.nome)}${editavel ? ` <button type="button" class="x" data-ag-rm="${esc(a.slug)}" data-ag="${esc(chave)}" aria-label="Tirar ${esc(a.nome)}">×</button>` : ""}</span>`).join("");
    const add = editavel && (lista?.length ?? 0) < 5 && catalogo?.length
      ? `<select data-ag-add="${esc(chave)}" aria-label="Adicionar agente"><option value="">+ agente</option>${catalogo.map((a) => `<option value="${esc(a.slug)}">${esc(a.nome)}</option>`).join("")}</select>` : "";
    return `<div class="as-ag">${chips || `<span class="dim">nenhum agente</span>`}${add}</div>`;
  }
  /** Liga os botões do editor: salvar(chave, novaListaDeSlugs). */
  function ligarEditorAgentes(raiz, listaDe, salvar) {
    raiz.querySelectorAll("[data-ag-rm]").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.ag;
      salvar(k, (listaDe(k) ?? []).map((a) => a.slug).filter((x) => x !== b.dataset.agRm));
    }));
    raiz.querySelectorAll("[data-ag-add]").forEach((sel) => sel.addEventListener("change", () => {
      const k = sel.dataset.agAdd;
      if (sel.value) salvar(k, [...(listaDe(k) ?? []).map((a) => a.slug), sel.value]);
    }));
  }

  // ---------------- testes mínimos ----------------
  const T_ICON = { passou: "✔", falhou: "✖", pendente: "○", nao_rodou: "–", precisa_voce: "!" };
  const T_COR = { passou: "var(--ok)", falhou: "var(--bad)", pendente: "var(--dim)", nao_rodou: "var(--warn)", precisa_voce: "var(--warn)" };
  function listaTestes(t, e, podeMarcar) {
    if (!t.testes_minimos?.length) return "";
    return `<div class="testes"><strong>Testes mínimos</strong>${t.testes_minimos.map((x) => {
      const r = e?.testes?.[x.id];
      const st = r?.status ?? "pendente";
      return `<div class="teste">
        <span class="ti" style="color:${T_COR[st]}" title="${esc(st)}">${T_ICON[st] ?? "○"}</span>
        <div class="grow" style="min-width:0"><div>${esc(x.descricao)} <span class="dim">· ${x.tipo === "manual" ? "você confere" : "automático"}${r?.fonte ? ` · por ${esc(r.fonte)}` : ""}</span></div>
          ${x.comando ? `<code class="mono dim">${esc(x.comando)}</code>` : ""}
          ${r?.evidencia ? `<details><summary class="dim">detalhes</summary><pre class="diff">${esc(r.evidencia)}</pre></details>` : ""}</div>
        ${podeMarcar && x.tipo === "manual" ? `<button class="btn sm" data-tm="${esc(t.id)}|${esc(x.id)}|passou" type="button" aria-label="Passou">✔</button><button class="btn sm" data-tm="${esc(t.id)}|${esc(x.id)}|falhou" type="button" aria-label="Falhou">✖</button>` : ""}
      </div>`;
    }).join("")}</div>`;
  }
  function renderCoord(c) {
    const det = $("#detalhe");
    if (det.querySelector("#areaDiffC")?.innerHTML || det.contains(document.activeElement) && document.activeElement.tagName === "SELECT") return; // não atrapalha quem está lendo o diff ou escolhendo
    const fer = estado?.ferramentas ?? {};
    const tarefas = c.plano?.tarefas ?? [];
    const html = tarefas.map((t) => {
      const e = c.execucao?.[t.id];
      const r = c.rotas?.[t.id];
      const st = e?.status ?? (c.status === "plano_pronto" ? "esperando" : "esperando");
      const botoes = [];
      if (e) {
        if (st === "aguardando_voce" && e.tarefaId) botoes.push(`<button class="btn sm primary" data-ac="juntar" data-t="${esc(t.id)}">Juntar</button><button class="btn sm" data-ac="ajustar" data-t="${esc(t.id)}">Pedir ajuste</button>`);
        if (st === "aguardando_voce" && !e.tarefaId) botoes.push(`<button class="btn sm primary" data-ac="iniciar" data-t="${esc(t.id)}">Começar mesmo assim</button>`);
        if (st === "erro") botoes.push(`<button class="btn sm primary" data-ac="tentar_de_novo" data-t="${esc(t.id)}">Tentar de novo</button>`);
        if (st === "conflito") botoes.push(`<button class="btn sm primary" data-ac="resolver_conflito" data-t="${esc(t.id)}">Resolver conflito</button>`);
        if (!["juntada", "descartada", "sem_mudancas"].includes(st)) botoes.push(`<button class="btn sm danger" data-ac="descartar" data-t="${esc(t.id)}">Descartar</button>`);
        if (e.tarefaId) botoes.push(`<a class="btn sm ghost" href="#/t/${esc(e.tarefaId)}">Abrir conversa${e.tarefa?.pendentes ? ` (${e.tarefa.pendentes} pede você)` : ""}</a>`);
        if (e.tarefaId && !["esperando", "rodando", "descartada", "sem_mudancas"].includes(st) && c.integWt && c.status !== "entregue") botoes.push(`<button class="btn sm jev" data-pv="${esc(t.id)}" type="button">Abrir prévia</button>`);
        if (t.testes_minimos?.some((x) => x.tipo === "automatico") && e.tarefaId && !["esperando", "rodando", "ajustando", "revisando", "descartada"].includes(st) && c.status !== "entregue") botoes.push(`<button class="btn sm" data-trodar="${esc(t.id)}" type="button">Rodar testes de novo</button>`);
      }
      const agentesEtapa = c.agentesTarefa?.[t.id] ?? null;
      const podeAgentes = !["rodando", "revisando", "juntada", "descartada", "sem_mudancas"].includes(st) && !["entregue", "descartada"].includes(c.status);
      return `<div class="tarefa-plano">
        <div class="row"><strong class="grow">${esc(t.titulo)}</strong>${chip(st)}</div>
        ${t.depende_de.length ? `<div class="dim">Depois de: ${t.depende_de.map((d) => esc(tarefas.find((x) => x.id === d)?.titulo ?? d)).join(", ")}</div>` : ""}
        <div class="desc">${esc(t.descricao)}</div>
        ${c.status === "plano_pronto"
          ? `<label class="f">Ferramenta <select data-rota="${esc(t.id)}">${Object.values(fer).map((f) => `<option value="${esc(f.id)}"${r?.ferramenta === f.id ? " selected" : ""}${f.ok ? "" : " disabled"}>${esc(f.nome)}</option>`).join("")}</select></label><div class="dim">${esc(r?.motivo ?? "")}</div>`
          : `<div class="dim"><span class="chip tool">${esc(NOMES[r?.ferramenta] ?? r?.ferramenta ?? "")}</span> ${esc(r?.motivo ?? "")}</div>`}
        ${e?.tarefa && ["rodando", "ajustando", "resolvendo"].includes(st) ? `<div class="bar"><i style="width:${e.tarefa.progresso}%"></i></div><div class="dim">${esc(e.tarefa.ultimaMensagem ?? "")}</div>` : ""}
        ${e?.revisao ? `<div class="dim">Revisão do Jev: <strong>${esc(e.revisao.veredito)}</strong>${e.revisao.risco ? ` · risco ${esc(e.revisao.risco.split(":")[0].toLowerCase())}` : ""}</div>` : ""}
        ${e?.motivo ? `<div class="risco">${esc(e.motivo)}</div>` : ""}
        ${listaTestes(t, e, !!e?.tarefaId && c.status !== "entregue")}
        ${agentesEtapa || podeAgentes ? `<div class="row" style="flex-wrap:wrap;gap:6px"><span class="dim">Agentes:</span>${agentesEtapa ? editorAgentes(agentesEtapa, t.id, podeAgentes) : podeAgentes ? editorAgentes([], t.id, true) + `<span class="dim">${c.agentes === "auto" ? "(sem escolha: o Jev liga os úteis)" : ""}</span>` : ""}</div>` : ""}
        ${botoes.length ? `<div class="acoes">${botoes.join("")}</div>` : ""}
      </div>`;
    }).join("");
    const topo = [];
    if (c.status === "plano_pronto") topo.push(`<button class="btn primary" id="cAprovar">Aprovar e começar</button><button class="btn danger" id="cDescartar">Descartar</button>`);
    if (c.status === "executando" || c.status === "planejando") topo.push(`<button class="btn danger" id="cParar">Parar</button>`);
    if (c.status === "parada" && c.integracao) topo.push(`<button class="btn primary" id="cRetomar">Retomar</button><button class="btn danger" id="cDescartar">Descartar</button>`);
    if (c.integWt && ["executando", "concluida", "parada"].includes(c.status)) topo.push(`<button class="btn jev" id="cPrevia" type="button">Abrir prévia do resultado</button>`);
    if (c.status === "concluida") topo.push(`<button class="btn" id="cDiff">Ver resultado</button><button class="btn primary" id="cEntregar">Levar para ${esc(c.branchBase ?? "a sua branch")}</button><button class="btn danger" id="cDescartar">Descartar</button>`);
    if (c.status === "erro") topo.push(`<button class="btn danger" id="cDescartar">Descartar</button>`);
    det.innerHTML = `
      <div class="dhead">
        <div class="row"><button class="btn sm ghost" data-voltar aria-label="Voltar">←</button><span class="chip tool">Time</span>${chip(c.status)}<span class="dim">${esc(AUT[c.autonomia] ?? "")}</span></div>
        <h3>${esc(c.objetivo.split("\n")[0])}</h3>
        ${c.objetivo.includes("\n") ? `<details class="dim"><summary>Objetivo completo${c.origem?.assistente ? ` · <a href="#/a/${esc(c.origem.assistente)}">briefing</a>` : ""}</summary><div style="white-space:pre-wrap">${esc(c.objetivo.split("\n").slice(1).join("\n").trim())}</div></details>` : ""}
        ${c.integracao ? `<div class="dim mono">branch: ${esc(c.integracao)}</div>` : ""}
      </div>
      <div class="dbody">
        ${c.erro ? `<div class="ev fim err">${esc(c.erro)}</div>` : ""}
        ${c.plano?.resumo ? `<p class="muted">${esc(c.plano.resumo)}</p>` : ""}
        ${c.status === "planejando" ? `<p class="muted">O Claude Code está lendo o projeto e montando o plano (só leitura, sem alterar nada)…</p>` : ""}
        ${topo.length ? `<div class="acoes">${topo.join("")}</div>` : ""}
        ${c.status === "concluida" && c.pendenciasTestes?.length ? `<div class="risco">Antes de levar para a sua branch, confira ${c.pendenciasTestes.length} teste(s) mínimo(s): ${c.pendenciasTestes.map((x) => esc(`${x.tarefa}: ${x.descricao}`)).join("; ")}. Use a prévia e marque ✔ ou ✖.</div>` : ""}
        ${c.status === "plano_pronto" ? `<p class="dim">Cada tarefa roda numa cópia separada do projeto (git worktree). O Jev revisa cada resultado antes de juntar; nada muda na sua pasta até você levar o resultado.</p>` : ""}
        ${html}
        <div id="areaDiffC"></div>
        <h2>Registro</h2>
        <div class="log">${[...(c.log ?? [])].reverse().map((l) => `<div><span class="dim">${esc(new Date(l.quando).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }))}</span> ${esc(l.texto)}</div>`).join("")}</div>
      </div>`;
    det.querySelector("[data-voltar]").onclick = () => ir("#/");
    det.querySelectorAll("[data-rota]").forEach((s) => s.addEventListener("change", () => acao(() => api("coord_ajustar", { id: c.id, tarefa: s.dataset.rota, ferramenta: s.value }), "Ferramenta trocada.")));
    det.querySelectorAll("[data-ac]").forEach((b) => b.addEventListener("click", async () => {
      let mensagem;
      if (b.dataset.ac === "ajustar") { mensagem = prompt("O que precisa mudar?"); if (!mensagem) return; }
      if (b.dataset.ac === "descartar" && !confirm("Descartar o trabalho desta tarefa?")) return;
      b.disabled = true;
      const r = await acao(() => api("coord_decidir", { id: c.id, tarefa: b.dataset.t, acao: b.dataset.ac, mensagem }));
      if (r) renderCoord(r);
    }));
    $("#cAprovar")?.addEventListener("click", async (ev) => { ev.target.disabled = true; const r = await acao(() => api("coord_aprovar", { id: c.id }), "Começou!"); if (r) renderCoord(r); else ev.target.disabled = false; });
    $("#cParar")?.addEventListener("click", async () => { if (confirm("Parar todas as tarefas deste objetivo?")) { const r = await acao(() => api("coord_parar", { id: c.id })); if (r) renderCoord(r); } });
    $("#cRetomar")?.addEventListener("click", async () => { const r = await acao(() => api("coord_retomar", { id: c.id })); if (r) renderCoord(r); });
    $("#cDescartar")?.addEventListener("click", async () => { if (confirm("Descartar este objetivo e apagar as branches dele?")) { await acao(() => api("coord_descartar", { id: c.id }), "Descartado."); ir("#/"); carregar(); } });
    $("#cDiff")?.addEventListener("click", async () => { const d = await acao(() => api("coord_diff", { id: c.id })); if (d) $("#areaDiffC").innerHTML = renderDiff(d.diff, d.arquivos) + `<button class="btn sm" id="fecharDiff">Fechar</button>`; $("#fecharDiff")?.addEventListener("click", () => { $("#areaDiffC").innerHTML = ""; }); });
    $("#cEntregar")?.addEventListener("click", async () => {
      const pend = c.pendenciasTestes?.length ?? 0;
      if (!confirm(pend ? `Ainda há ${pend} teste(s) mínimo(s) sem passar. Levar para a branch ${c.branchBase} mesmo assim?` : `Juntar o resultado na branch ${c.branchBase}? Isso altera os arquivos da pasta do projeto.`)) return;
      const r = await acao(() => api("coord_entregar", { id: c.id, forcar: pend > 0 }), "Pronto! O resultado está na sua branch.");
      if (r) renderCoord(r);
    });
    $("#cPrevia")?.addEventListener("click", () => abrirPrevia({ coordId: c.id }, "prévia do resultado"));
    det.querySelectorAll("[data-pv]").forEach((b) => b.addEventListener("click", () => abrirPrevia({ coordId: c.id, etapa: b.dataset.pv }, "prévia da etapa")));
    det.querySelectorAll("[data-trodar]").forEach((b) => b.addEventListener("click", async () => { b.disabled = true; b.textContent = "Rodando…"; const r = await acao(() => api("coord_testes_rodar", { id: c.id, tarefa: b.dataset.trodar }), "Testes rodados."); if (r) renderCoord(r); else b.disabled = false; }));
    det.querySelectorAll("[data-tm]").forEach((b) => b.addEventListener("click", async () => {
      const [tarefa, teste, status] = b.dataset.tm.split("|");
      const nota = status === "falhou" ? prompt("O que deu errado? (vai junto se você pedir ajuste)") ?? "" : "";
      const r = await acao(() => api("coord_teste_marcar", { id: c.id, tarefa, teste, status, nota }));
      if (r) renderCoord(r);
    }));
    ligarEditorAgentes(det, (k) => c.agentesTarefa?.[k] ?? [], async (k, slugs) => { const r = await acao(() => api("coord_agentes_definir", { id: c.id, tarefa: k, agentes: slugs })); if (r) renderCoord(r); });
    if (!catalogo) garantirCatalogo().then(() => { if (catalogo?.length) renderCoord(c); });
  }

  // ---------------- assistente de briefing ----------------
  let assistentes = [];
  let catalogo = null;
  let asCache = null;
  const AS_ST = { pensando: "pensando", perguntas: "pergunta você", validando: "Jev validando", pronto: "briefing pronto", erro: "erro", lancado: "time trabalhando" };
  const AS_CLS = { pensando: "rodando", perguntas: "aguardando", validando: "revisando", pronto: "plano_pronto", erro: "erro", lancado: "concluida" };
  const asChip = (s) => `<span class="chip st-${AS_CLS[s] ?? "parada"}">${esc(AS_ST[s] ?? s)}</span>`;
  const asAtivo = (s) => s === "pensando" || s === "validando";

  function itemAssistente(a) {
    const sel = rota?.tipo === "a" && rota.id === a.id;
    return `<button class="item${sel ? " sel" : ""}" data-ir="${a.coordId ? `#/c/${esc(a.coordId)}` : `#/a/${esc(a.id)}`}">
      <div class="row"><span class="chip tool">Assistente</span>${asChip(a.status)}<span class="dim" style="margin-left:auto">${esc(ago(a.atualizado))}</span></div>
      <div class="t">${esc(a.titulo)}</div>
      ${asAtivo(a.status) && a.etapa ? `<div class="m">${esc(a.etapa)}…</div>` : ""}
    </button>`;
  }

  async function carregarAssistente() {
    if (rota?.tipo !== "a") return;
    try {
      const s = await api("assistente_obter", { id: rota.id });
      if (!catalogo && s.status === "pronto") catalogo = await api("assistente_catalogo").catch(() => []);
      renderAssistente(s);
    } catch (e) {
      $("#detalhe").innerHTML = `<div class="vazio"><h2>Não encontrei</h2><p>${esc(e.message)}</p><button class="btn" data-voltar>Voltar</button></div>`;
      $("#detalhe [data-voltar]").onclick = () => ir("#/");
    }
  }

  function barraJevA(rotulo, p, bom = "sim") {
    if (p == null) return "";
    const ok = bom === "sim" ? p > 0.7 : p < 0.3, ruim = bom === "sim" ? p < 0.3 : p > 0.7;
    return `<div class="mp-jev"><span class="grow">${esc(rotulo)}</span><span class="bar" style="width:90px"><i style="width:${Math.round(p * 100)}%;background:${ok ? "var(--ok)" : ruim ? "var(--bad)" : "var(--warn)"}"></i></span><span class="mono" style="width:40px;text-align:right">${pct(p)}</span></div>`;
  }
  const lista = (titulo, itens) => (itens?.length ? `<div><strong>${esc(titulo)}</strong><ul>${itens.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");

  function renderAssistente(s) {
    const det = $("#detalhe");
    // não atrapalha quem está escrevendo ou escolhendo
    const foco = document.activeElement;
    if (det.contains(foco) && ["TEXTAREA", "SELECT", "INPUT"].includes(foco.tagName)) return;
    const assin = JSON.stringify([s.atualizado, s.status, s.tarefa?.rodando, s.tarefa?.pendentes]);
    if (asCache === assin && $("#asView")) return;
    asCache = assin;
    const rascunho = $("#asMsg")?.value ?? "";
    const fer = estado?.ferramentas ?? {};
    const b = s.briefing, v = s.validacao;
    const msgs = s.mensagens.map((m) => {
      if (m.de === "voce") return `<div class="ev voce">${esc(m.texto)}</div>`;
      if (m.de === "jev") return `<div class="rev"><strong>Jev</strong> ${esc(m.texto)}</div>`;
      return m.texto ? `<div class="ev texto">${esc(m.texto)}</div>` : "";
    }).join("");
    let corpo = "";
    if (asAtivo(s.status)) {
      corpo = `<div class="box"><strong>${esc(s.status === "validando" ? "O Jev está validando o briefing…" : `O assistente está ${s.etapa ?? "pensando"}…`)}</strong>
        ${s.tarefa?.pendentes ? `<p>A ferramenta está pedindo uma aprovação.</p>` : ""}
        <div class="row" style="margin-top:6px"><a class="btn sm ghost" href="#/t/${esc(s.tarefaId)}">Ver o que ele está fazendo</a><button class="btn sm danger" id="asParar" type="button">Parar</button></div></div>`;
    } else if (s.status === "perguntas" && s.perguntas?.length) {
      corpo = `<div class="box" id="asPerg"><h2>Responda o que souber</h2><p class="dim">O que ficar em branco, o assistente decide e lista como premissa.</p>
        ${s.perguntas.map((q) => `<div class="as-q" data-q="${esc(q.id)}"><div class="as-qt">${esc(q.pergunta)}</div>
          <div class="as-op">${q.opcoes.map((o) => `<label><input type="${q.multipla ? "checkbox" : "radio"}" name="q_${esc(q.id)}" value="${esc(o)}"> ${esc(o)}</label>`).join("")}</div>
          <input type="text" class="as-outra" placeholder="Outra resposta" maxlength="500"></div>`).join("")}
        <label class="f">Algo mais que ele deva saber?<textarea id="asExtra" rows="2"></textarea></label>
        <div class="acoes"><button class="btn primary" id="asResponder" type="button">Responder ▸</button><button class="btn ghost" id="asPular" type="button">Pular: decida você</button></div></div>`;
    }
    if (b) {
      const contagem = {};
      for (const t of b.equipe) contagem[t.ferramenta] = (contagem[t.ferramenta] ?? 0) + 1;
      const jevBox = v ? (v.semJev ? `<div class="box"><strong>Sem validação do Jev.</strong> <span class="dim">${esc(v.erro ?? "")}</span></div>`
        : `<div class="box"><div class="row"><h2 class="grow">Validação do Jev</h2>${v.aprovado ? `<span class="chip st-concluida">aprovado</span>` : `<span class="chip st-aguardando">revisar</span>`}<span class="dim">${esc(v.prontidao?.texto ?? "")}</span></div>
          ${barraJevA("Objetivo claro", v.itens?.clareza)}${barraJevA("Critérios verificáveis", v.itens?.criterios)}${barraJevA("Equipe cobre tudo", v.itens?.cobertura)}${barraJevA("Tarefas se sobrepõem", v.itens?.sobreposicao, "nao")}${barraJevA("Fiel à sua ideia", v.itens?.fiel)}
          ${!v.aprovado && v.problemas?.length ? `<ul class="dim">${v.problemas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p class="dim">Peça mudanças ao assistente abaixo, ou comece mesmo assim.</p>` : ""}</div>`) : "";
      const tarefasHtml = b.equipe.map((t) => {
        const sug = v?.sugestoes?.[t.id];
        const dep = t.depende_de?.length ? `<span class="dim">depois de: ${t.depende_de.map((d) => esc(b.equipe.find((x) => x.id === d)?.titulo ?? d)).join(", ")}</span>` : "";
        return `<div class="as-t" data-t="${esc(t.id)}">
          <div class="row"><strong class="grow">${esc(t.titulo)}</strong><span class="chip tool">${esc(t.tipo)}</span></div>
          <div class="dim" style="white-space:pre-wrap">${esc(t.descricao)}</div>
          ${dep}
          <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:4px">
            <label class="f grow">Ferramenta<select data-ferr ${s.coordId ? "disabled" : ""}>${Object.values(fer).map((f) => `<option value="${esc(f.id)}"${f.id === t.ferramenta ? " selected" : ""}${f.ok ? "" : " disabled"}>${esc(f.nome)}${f.ok ? "" : " (não instalado)"}</option>`).join("")}</select></label>
            <label class="f grow">Agentes (até 3)<div class="as-ag">${t.agentes.map((a) => `<span class="chip tool">${esc(a.emoji ? `${a.emoji} ` : "")}${esc(a.nome)}${s.coordId ? "" : ` <button type="button" class="x" data-rm="${esc(a.slug)}" aria-label="Tirar ${esc(a.nome)}">×</button>`}</span>`).join("") || `<span class="dim">nenhum</span>`}
              ${!s.coordId && t.agentes.length < 3 && catalogo?.length ? `<select data-add aria-label="Adicionar agente"><option value="">+ agente</option>${catalogo.map((a) => `<option value="${esc(a.slug)}">${esc(a.nome)}</option>`).join("")}</select>` : ""}</div></label>
          </div>
          ${listaTestes(t, null, false)}
          ${t.porque ? `<div class="dim">Por quê: ${esc(t.porque)}</div>` : ""}
          ${sug ? `<div class="dim">Jev: ${sug.ferramenta ? `${esc(NOMES[sug.ferramenta] ?? sug.ferramenta)} ${pct(sug.probabilidade)}${sug.ferramenta !== t.ferramenta && !s.coordId ? ` <button type="button" class="btn sm ghost" data-usar="${esc(sug.ferramenta)}">usar</button>` : " ✔"}` : `em dúvida (${sug.ranking.map((x) => `${esc(NOMES[x.rotulo] ?? x.rotulo)} ${pct(x.probabilidade)}`).join(", ")})`}</div>` : ""}
        </div>`;
      }).join("");
      corpo += `<div class="box as-brief"><div class="row"><h2 class="grow">${esc(b.titulo)}</h2>${s.validacao?.aprovado ? `<span class="chip st-concluida">Jev ✔</span>` : ""}</div>
          <p style="white-space:pre-wrap">${esc(b.objetivo)}</p>
          ${lista("Critérios de aceite", b.criterios_aceite)}
          ${lista("Validações", b.validacoes_iniciais.map((x) => `${x.descricao}${x.como ? ` — ${x.como}` : ""}`))}
          ${lista("Premissas (decididas por ele)", b.premissas)}
          ${lista("Riscos", b.riscos)}
          ${lista("Fora do escopo", b.fora_do_escopo)}
          ${s.avisos?.length ? `<p class="dim">${s.avisos.map(esc).join("<br>")}</p>` : ""}
        </div>
        ${jevBox}
        <div class="box"><div class="row"><h2 class="grow">Equipe</h2><span class="dim">${Object.entries(contagem).map(([k, n]) => `${esc(NOMES[k] ?? k)} ${n}`).join(" · ")}</span></div>${tarefasHtml}</div>
        ${s.coordId ? `<a class="btn primary" href="#/c/${esc(s.coordId)}">Acompanhar o time ▸</a>` : s.status === "pronto" ? `<div class="row" style="flex-wrap:wrap;gap:10px"><label class="f grow">Autonomia<select id="asAut">${Object.entries(AUT).map(([k, x]) => `<option value="${k}"${k === (escolhaAut ?? estado?.autonomia) ? " selected" : ""}>${x}</option>`).join("")}</select></label>
          <button class="btn primary" id="asLancar" type="button" style="min-height:48px;align-self:flex-end">Montar a equipe e começar ▸</button></div>` : ""}`;
    }
    if (s.erro && !asAtivo(s.status)) corpo = `<div class="box" style="border-color:var(--bad)">${esc(s.erro)}</div>` + corpo;
    const podeFalar = !asAtivo(s.status) && !s.coordId;
    det.innerHTML = `
      <div class="dhead">
        <div class="row"><button class="btn sm ghost" data-voltar aria-label="Voltar">←</button><span class="chip tool">Assistente · ${esc(NOMES[s.ferramenta] ?? s.ferramenta)}</span>${asChip(s.status)}<span class="grow"></span>${!s.coordId ? `<button class="btn sm ghost" id="asDescartar" type="button">Descartar</button>` : ""}</div>
        <h3>${esc(b?.titulo ?? s.ideia.split("\n")[0])}</h3>
        ${asAtivo(s.status) ? `<div class="bar"><i class="indet" style="width:40%"></i></div>` : ""}
      </div>
      <div class="dbody" id="asView" style="max-width:900px;width:100%;margin:0 auto">${msgs}${corpo}</div>
      ${podeFalar ? `<div class="composer"><textarea id="asMsg" rows="1" placeholder="${b ? "Pedir mudanças no briefing…" : "Mensagem para o assistente…"}">${esc(rascunho)}</textarea><button class="btn primary" id="asEnviar" type="button">Enviar</button></div>` : ""}`;
    det.querySelector("[data-voltar]").onclick = () => ir("#/");
    const recarregar = (r) => { if (r) { asCache = null; renderAssistente(r); carregar(); } };
    $("#asParar")?.addEventListener("click", async () => recarregar(await acao(() => api("assistente_parar", { id: s.id }))));
    $("#asDescartar")?.addEventListener("click", async () => { if (confirm("Descartar esta conversa com o assistente?")) { await acao(() => api("assistente_descartar", { id: s.id })); ir("#/"); carregar(); } });
    $("#asEnviar")?.addEventListener("click", async () => {
      const t = $("#asMsg").value.trim();
      if (!t) return;
      $("#asMsg").value = "";
      recarregar(await acao(() => api("assistente_mensagem", { id: s.id, texto: t })));
    });
    $("#asMsg")?.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("#asEnviar").click(); } });
    $("#asPular")?.addEventListener("click", async () => recarregar(await acao(() => api("assistente_pular", { id: s.id }))));
    $("#asResponder")?.addEventListener("click", async () => {
      const respostas = {};
      det.querySelectorAll(".as-q").forEach((q) => {
        const marcadas = [...q.querySelectorAll("input:checked")].map((i) => i.value);
        const outra = q.querySelector(".as-outra").value.trim();
        if (outra) marcadas.push(outra);
        if (marcadas.length) respostas[q.dataset.q] = marcadas;
      });
      recarregar(await acao(() => api("assistente_responder", { id: s.id, respostas, texto: $("#asExtra").value.trim() })));
    });
    det.querySelectorAll(".as-t").forEach((el) => {
      const tid = el.dataset.t;
      const t = b.equipe.find((x) => x.id === tid);
      el.querySelector("[data-ferr]")?.addEventListener("change", async (e) => recarregar(await acao(() => api("assistente_ajustar", { id: s.id, tarefa: tid, ferramenta: e.target.value }))));
      el.querySelectorAll("[data-usar]").forEach((x) => x.addEventListener("click", async () => recarregar(await acao(() => api("assistente_ajustar", { id: s.id, tarefa: tid, ferramenta: x.dataset.usar })))));
      el.querySelectorAll("[data-rm]").forEach((x) => x.addEventListener("click", async () => recarregar(await acao(() => api("assistente_ajustar", { id: s.id, tarefa: tid, agentes: t.agentes.filter((a) => a.slug !== x.dataset.rm) })))));
      el.querySelector("[data-add]")?.addEventListener("change", async (e) => {
        const a = catalogo.find((x) => x.slug === e.target.value);
        if (a) recarregar(await acao(() => api("assistente_ajustar", { id: s.id, tarefa: tid, agentes: [...t.agentes, { slug: a.slug, nome: a.nome, emoji: a.emoji }] })));
      });
    });
    $("#asLancar")?.addEventListener("click", async () => {
      const btn = $("#asLancar");
      btn.disabled = true;
      btn.textContent = "Montando…";
      const r = await acao(() => api("assistente_lancar", { id: s.id, autonomia: $("#asAut").value }));
      if (!r) { btn.disabled = false; btn.textContent = "Montar a equipe e começar ▸"; return; }
      if (r.aviso) toast(r.aviso);
      ir(`#/c/${r.coordId}`);
      carregar();
    });
  }

  // ---------------- equipe e conhecimento (RAG) ----------------
  const FONTE_DICA = { pasta: "Pasta (ex.: docs ou C:\\\\specs). Relativa = dentro do projeto da tarefa.", arquivo: "Arquivo (ex.: README.md ou caminho completo)", nota: "Texto: regras, padrões, decisões…", url: "https://…" };
  async function carregarEquipe(foco) {
    if (rota?.tipo !== "k") return;
    await garantirCatalogo();
    let e;
    try {
      e = await api("equipe_estado", { projetoId: projetoSel });
    } catch (err) {
      $("#detalhe").innerHTML = `<div class="vazio"><h2>Não consegui abrir</h2><p>${esc(err.message)}</p></div>`;
      return;
    }
    renderEquipe(e, foco ?? rota.id);
  }
  function cartaoFontes(dono, fontes) {
    return `<div class="fontes">${fontes.map((f) => `<div class="fonte${f.existe ? "" : " off"}"><span class="chip tool">${esc(f.tipo)}</span><div class="grow" style="min-width:0"><div>${esc(f.titulo)}</div>
        <div class="dim mono" style="overflow-wrap:anywhere">${esc(f.tipo === "nota" ? (f.texto ?? "").slice(0, 160) : f.url ?? f.caminho ?? "")}${f.contagem != null ? ` · ${f.contagem} ${f.tipo === "pasta" ? "arquivo(s)" : "trecho(s)"}` : ""}${f.existe ? "" : " · não achei agora (relativo vale na pasta de cada tarefa)"}</div></div>
        <button class="btn sm ghost" data-frm="${esc(dono)}|${esc(f.id)}" type="button" aria-label="Tirar ${esc(f.titulo)}">×</button></div>`).join("") || `<p class="dim">Sem conhecimento ainda.</p>`}
      <details class="add-fonte"><summary class="btn sm">+ Conhecimento</summary>
        <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">
          <select data-ftipo="${esc(dono)}">${["pasta", "arquivo", "nota", "url"].map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
          <input type="text" class="grow" data-ftitulo="${esc(dono)}" placeholder="Título (opcional)" maxlength="120">
        </div>
        <textarea data-fval="${esc(dono)}" rows="2" placeholder="${esc(FONTE_DICA.pasta)}"></textarea>
        <button class="btn sm primary" data-fadd="${esc(dono)}" type="button">Adicionar</button>
      </details>
      <div class="row" style="gap:6px;margin-top:6px"><input type="text" class="grow" data-qbusca="${esc(dono)}" placeholder="Testar a busca (ex.: como funciona o pagamento?)"><button class="btn sm" data-busca="${esc(dono)}" type="button">Buscar</button></div>
      <div data-res="${esc(dono)}"></div></div>`;
  }
