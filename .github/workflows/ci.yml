name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash scripts/ci-run.sh npm test
      - run: bash scripts/ci-run.sh npm run build
      - name: Start the app and fetch the UI
        shell: bash
        run: |
          node bin/leradeveloper.js --no-open --port 4799 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4799/ > page.html && break; sleep 1; done
          grep -q 'leradeveloper-token' page.html
          grep -q '<title>leradeveloper</title>' page.html

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash scripts/ci-run.sh npm run check -- --threshold error

  parity:
    name: Renderer parity with upstream convert.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Convert the upstream catalog with the official script
        run: |
          git clone --depth 1 https://github.com/msitarzewski/agency-agents.git ../upstream
          cd ../upstream
          for t in antigravity gemini-cli opencode cursor qwen zcode codex osaurus dsh; do
            ./scripts/convert.sh --tool "$t" --out ../conv > /dev/null
          done
      - run: node test/parity.mjs ../upstream ../conv

  ui:
    name: UI smoke test (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash scripts/ci-run.sh npm run build
      - run: npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: bash scripts/ci-run.sh node test/ui-smoke.mjs screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots
      # Also keep the latest screenshots on an orphan `ci-screenshots` branch,
      # so they can be browsed on GitHub (or fetched with git) without logs access.
      - name: Publish screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "UI screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
