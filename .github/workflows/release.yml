name: Release

# Push a tag like v0.2.0 (matching package.json) to publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          V="${TAG#v}"
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "tag $TAG != package.json $P"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Package
        run: |
          N="leradeveloper-$VERSION"
          mkdir -p "dist/$N"
          cp -r bin server build package.json LICENSE README.md "dist/$N/"
          chmod +x "dist/$N/bin/leradeveloper.js"
          cd dist
          tar -czf "$N.tar.gz" "$N"
          zip -qr "$N.zip" "$N"
          echo "SHA256_TGZ=$(sha256sum "$N.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA256_ZIP=$(sha256sum "$N.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Render the Homebrew formula and Scoop manifest
        run: |
          for f in leradeveloper.rb leradeveloper.json; do
            sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256_TGZ@/$SHA256_TGZ/g" -e "s/@SHA256_ZIP@/$SHA256_ZIP/g" \
              "packaging/$f" > "dist/$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: leradeveloper ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/leradeveloper-${{ env.VERSION }}.tar.gz
            dist/leradeveloper-${{ env.VERSION }}.zip
            dist/leradeveloper.rb
            dist/leradeveloper.json

      # Optional: set a TAP_TOKEN secret (fine-grained PAT with Contents: write on
      # paulopng/homebrew-leradeveloper) and the tap updates itself on every release.
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set; copy dist/leradeveloper.rb and dist/leradeveloper.json to the tap by hand."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/paulopng/homebrew-leradeveloper.git" tap
          mkdir -p tap/Formula tap/bucket
          cp dist/leradeveloper.rb tap/Formula/leradeveloper.rb
          cp dist/leradeveloper.json tap/bucket/leradeveloper.json
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "leradeveloper $VERSION"
          git push
