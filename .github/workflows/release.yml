name: Release

# Two ways to publish:
#   - bump "version" in package.json and push to main (the tag is created for you), or
#   - push a tag like v0.2.0 that matches package.json.
# A version that already has a release is skipped.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json v$V"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$V already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm install --no-audit --no-fund
        if: steps.v.outputs.skip != 'true'
      - run: npm test
        if: steps.v.outputs.skip != 'true'
      - run: npm run build
        if: steps.v.outputs.skip != 'true'

      - name: Package
        if: steps.v.outputs.skip != 'true'
        run: |
          N="leradeveloper-$VERSION"
          mkdir -p "dist/$N"
          cp -r bin server build package.json LICENSE README.md "dist/$N/"
          chmod +x "dist/$N/bin/leradeveloper.js" "dist/$N/bin/lera-decisor.js"
          cd dist
          tar -czf "$N.tar.gz" "$N"
          zip -qr "$N.zip" "$N"
          echo "SHA256_TGZ=$(sha256sum "$N.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA256_ZIP=$(sha256sum "$N.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Render the Homebrew formula and Scoop manifest
        if: steps.v.outputs.skip != 'true'
        run: |
          for f in leradeveloper.rb leradeveloper.json; do
            sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256_TGZ@/$SHA256_TGZ/g" -e "s/@SHA256_ZIP@/$SHA256_ZIP/g" \
              "packaging/$f" > "dist/$f"
          done

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: leradeveloper ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/leradeveloper-${{ env.VERSION }}.tar.gz
            dist/leradeveloper-${{ env.VERSION }}.zip
            dist/leradeveloper.rb
            dist/leradeveloper.json

      # Optional: set a TAP_TOKEN secret (fine-grained PAT with Contents: write on
      # paulopng/homebrew-leradeveloper) and the tap updates itself on every release.
      - name: Update the tap
        if: steps.v.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set; copy dist/leradeveloper.rb and dist/leradeveloper.json to the tap by hand."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/paulopng/homebrew-leradeveloper.git" tap
          mkdir -p tap/Formula tap/bucket
          cp dist/leradeveloper.rb tap/Formula/leradeveloper.rb
          cp dist/leradeveloper.json tap/bucket/leradeveloper.json
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "leradeveloper $VERSION"
          git push
